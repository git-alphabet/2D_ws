# ============================================================
# docker/compose.serena.yml — Serena MCP 代码分析服务
# ============================================================
# Serena 是 AI 编程助手（GitHub Copilot / Claude 等）的 MCP 后端，
# 提供语义代码检索、符号查找、智能编辑等能力。
#
# 用法：
#   docker compose -f docker/compose.serena.yml up -d
#   docker compose -f docker/compose.serena.yml down
#
# 注意：
#   - 使用 network_mode: host，与 dev 容器天然互通
#   - VS Code 通过 .vscode/mcp.json 以 stdio 方式启动 Serena，
#     通常不需要手动 up 这个 compose；此文件主要用于：
#     1. 手动拉取/更新镜像
#     2. 调试 Serena 本身
# ============================================================

services:
  serena:
    image: ghcr.io/oraios/serena:latest
    container_name: serena-mcp
    network_mode: host
    stdin_open: true
    tty: true
    volumes:
      # 项目代码（只读，Serena 只分析不修改）
      - type: bind
        source: ../
        target: /workspace/ros2_ws
        read_only: true
      # Serena 配置与记忆持久化到宿主机 ~/.serena
      - type: bind
        source: ${HOME}/.serena
        target: /home/user/.serena
    command:
      - serena
      - start-mcp-server
      - --project
      - /workspace/ros2_ws
      - --context
      - claude-code
      - --transport
      - streamable-http
      - --port
      - "9121"
    restart: unless-stopped
