# compose.snapshot.yml — 将当前运行中的开发容器快照为本地新镜像
# 用法（项目根目录执行）:
#   docker compose -f docker/compose.snapshot.yml up --abort-on-container-exit --exit-code-from snapshot
#
# 可选参数（通过环境变量覆盖）:
#   TARGET_CONTAINER=gxu2026-nav-robot   # 需要快照的容器名

name: nav-snapshot

services:
  snapshot:
    image: docker:27-cli
    env_file:
      - .env
    working_dir: /workspace
    environment:
      DOCKERHUB_NS: ${DOCKERHUB_NS:-}
      IMAGE_REPO: ${IMAGE_REPO:-}
      TARGET_CONTAINER: ${TARGET_CONTAINER:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint:
      - /bin/sh
      - -lc
      - |
        set -eu
        NS="$${DOCKERHUB_NS:-}"
        REPO_NAME="$${IMAGE_REPO:-}"

        if [ -z "$$NS" ] || [ -z "$$REPO_NAME" ]; then
          echo "[ERROR] Missing config in .env: DOCKERHUB_NS and IMAGE_REPO"
          exit 1
        fi

        REPO="$$NS/$$REPO_NAME"
        TAG="$$(TZ=UTC-8 date +%Y%m%d%H%M)"
        TARGET="$${TARGET_CONTAINER:-}"

        # auto-detect running nav container
        if [ -z "$$TARGET" ]; then
          for c in gxu2026-nav-laptop gxu2026-nav-robot docker-nav-1; do
            if docker container inspect "$$c" >/dev/null 2>&1; then
              TARGET="$$c"
              break
            fi
          done
        fi

        if [ -z "$$TARGET" ] || ! docker container inspect "$$TARGET" >/dev/null 2>&1; then
          echo "[ERROR] No running nav container found. Set TARGET_CONTAINER=xxx"
          docker ps --format '{{.Names}} {{.Status}}'
          exit 1
        fi

        echo "[1/2] commit $$TARGET -> $$REPO:$$TAG"
        docker commit "$$TARGET" "$$REPO:$$TAG"

        echo "[2/2] tag latest"
        docker tag "$$REPO:$$TAG" "$$REPO:latest"

        echo "$$TAG" > /workspace/.last_snapshot_tag
        echo "[DONE] $$REPO:$$TAG and $$REPO:latest saved locally"