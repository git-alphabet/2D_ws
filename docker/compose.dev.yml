# ============================================================
# docker/compose.dev.yml — 启动开发容器
# ============================================================
# 两种 profile，对应两个使用场景：
#
#   laptop  笔记本开发机（有 NVIDIA GPU，跑仿真 / Gazebo / Rviz）
#   robot   小电脑实车（无 GPU，只跑 ROS 节点）
#
# 用法（Container Tools UI）：
#   右键本文件 → "Compose Up (Select Services)"
#   选 dev-laptop 或 dev-robot
#
# 用法（命令行）：
#   # 笔记本（有 GPU）
#   docker compose -f docker/compose.dev.yml --profile laptop up dev-laptop
#
#   # 小电脑实车（无 GPU）
#   docker compose -f docker/compose.dev.yml --profile robot up dev-robot
#
# 环境变量：
#   DOCKERHUB_NS   Docker Hub 用户名（默认 alphabet2006）
#   IMAGE_TAG      镜像 tag（默认 latest）
# ============================================================

x-base: &base
  image: ${DOCKERHUB_NS:-alphabet2006}/${IMAGE_REPO:-gxu2026-nav-env}:${IMAGE_TAG:-latest}
  network_mode: host
  privileged: true
  stdin_open: true
  tty: true
  environment:
    DISPLAY: ${DISPLAY:-:0}
    XAUTHORITY: /tmp/.docker.xauth
    TERM: xterm-256color
    QT_X11_NO_MITSHM: "1"
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
    - ../src:/ws/src                        # 代码挂载（改代码立刻生效）
    - ../scripts:/ws/scripts
    - gxu2026-nav-build:/ws/build           # 持久化编译缓存
    - gxu2026-nav-install:/ws/install
    - gxu2026-nav-log:/ws/log
  working_dir: /ws

services:

  # ---------- 笔记本（有 NVIDIA GPU）----------
  dev-laptop:
    <<: *base
    container_name: gxu2026-nav-laptop
    environment:
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/.docker.xauth
      TERM: xterm-256color
      QT_X11_NO_MITSHM: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: graphics,compute,display,utility
      __NV_PRIME_RENDER_OFFLOAD: "1"
      __GLX_VENDOR_LIBRARY_NAME: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, graphics, display, compute, utility]

  # ---------- 小电脑实车（无 GPU）----------
  dev-robot:
    <<: *base
    container_name: gxu2026-nav-robot
    # 实车不需要 X11 / GPU，覆盖掉 base 里的 X11 挂载
    volumes:
      - ../src:/ws/src
      - ../scripts:/ws/scripts
      - gxu2026-nav-build:/ws/build
      - gxu2026-nav-install:/ws/install
      - gxu2026-nav-log:/ws/log
      - /dev/bus/usb:/dev/bus/usb   # 挂载 USB 总线，支持 odin 热插拔
    devices:
      - /dev/bus/usb:/dev/bus/usb   # odin1 USB 设备直通
    environment:
      TERM: xterm-256color

volumes:
  gxu2026-nav-build:
  gxu2026-nav-install:
  gxu2026-nav-log:
