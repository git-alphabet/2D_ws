# ============================================================
# docker/compose.dev.yml — 启动开发容器
# ============================================================
# 两种 profile，对应两个使用场景：
#
#   laptop  笔记本开发机（有 NVIDIA GPU，跑仿真 / Gazebo / Rviz）
#   robot   小电脑实车（无 GPU，只跑 ROS 节点）
#
# 用法（Container Tools UI）：
#   右键本文件 → "Compose Up (Select Services)"
#   选 dev-laptop 或 dev-robot
#
# 用法（命令行）：
#   # 笔记本（有 GPU）
#   docker compose -f docker/compose.dev.yml --profile laptop up dev-laptop
#
#   # 小电脑实车（无 GPU）
#   docker compose -f docker/compose.dev.yml --profile robot up dev-robot
#
# 环境变量：
#   DOCKERHUB_NS   Docker Hub 用户名（默认 alphabet2006）
#   IMAGE_TAG      镜像 tag（默认 latest）
#   LOCAL_UID      宿主机用户 UID（默认 1000）
#   LOCAL_GID      宿主机用户 GID（默认 1000）
#   XAUTH_HOST_FILE 宿主机 Xauthority 文件（默认 /tmp/.docker.xauth）
# ============================================================

x-base: &base
  image: ${DOCKERHUB_NS:-alphabet2006}/${IMAGE_REPO:-gxu2026-nav-env}:${IMAGE_TAG:-latest}
  network_mode: host
  privileged: true
  init: true
  stdin_open: true
  tty: true
  environment:
    HOME: /tmp/home
    DISPLAY: ${DISPLAY:-:0}
    XAUTHORITY: /tmp/.docker.xauth
    TERM: xterm-256color
    QT_X11_NO_MITSHM: "1"
    ROS_HOME: /tmp/.ros
    ROS_LOG_DIR: /tmp/ros_log
    RCL_LOGGING_DISABLE_FILE_OUTPUT: "1"
    NEUPAN_SERVICE_URL: ${NEUPAN_SERVICE_URL:-http://127.0.0.1:18080}
  command: bash
  volumes:
    - ./ros_entrypoint.sh:/ros_entrypoint.sh:ro
    - ../.git:/ws/.git:ro
    - ../.buildcache:/ws/.buildcache
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - ${XAUTH_HOST_FILE:-/tmp/.docker.xauth}:/tmp/.docker.xauth:ro
    - ../src:/ws/src                        # 代码挂载（改代码立刻生效）
    - ../scripts:/ws/scripts
    - ../build:/ws/build                    # bind mount：宿主机可直接 rm -rf 清除
    - ../install:/ws/install
    - ../log:/ws/log
    - ../maps:/ws/maps                      # 自动保存的地图（容器生成→宿主机可见）
    - ../launch_logs:/ws/launch_logs        # 启动日志（容器生成→宿主机可见）
    - /dev/bus/usb:/dev/bus/usb             # USB 总线直通，支持 odin 热插拔
  devices:
    - /dev/bus/usb:/dev/bus/usb             # odin1 USB 设备直通
  working_dir: /ws

services:

  # ---------- NeuPAN runtime（Python 3.12，独立容器）----------
  neupan-runtime:
    image: ${DOCKERHUB_NS:-alphabet2006}/${IMAGE_REPO_NEUPAN:-gxu2026-neupan-runtime}:${IMAGE_TAG:-latest}
    profiles: ["laptop", "robot"]
    container_name: gxu2026-neupan-runtime
    network_mode: host
    init: true
    stdin_open: true
    tty: true
    environment:
      HOME: /tmp/home
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/.docker.xauth
      QT_X11_NO_MITSHM: "1"
      PYTHONUNBUFFERED: "1"
      MPLBACKEND: TkAgg
    volumes:
      - ../src:/ws/src
      - ../maps:/ws/maps
      - ../launch_logs:/ws/launch_logs
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTH_HOST_FILE:-/tmp/.docker.xauth}:/tmp/.docker.xauth:ro
    command: >-
      python /opt/neupan/service/server.py --host 0.0.0.0 --port 18080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # ---------- 笔记本（有 NVIDIA GPU）----------
  dev-laptop:
    <<: *base
    profiles: ["laptop"]
    container_name: gxu2026-nav-laptop
    shm_size: "1gb"
    depends_on:
      neupan-runtime:
        condition: service_healthy
    environment:
      HOME: /tmp/home
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/.docker.xauth
      TERM: xterm-256color
      QT_X11_NO_MITSHM: "1"
      ROS_HOME: /tmp/.ros
      ROS_LOG_DIR: /tmp/ros_log
      RCL_LOGGING_DISABLE_FILE_OUTPUT: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: graphics,compute,display,utility
      __NV_PRIME_RENDER_OFFLOAD: "1"
      __GLX_VENDOR_LIBRARY_NAME: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, graphics, display, compute, utility]

  # ---------- 小电脑实车（无 GPU）----------
  dev-robot:
    <<: *base
    profiles: ["robot"]
    container_name: gxu2026-nav-robot
    depends_on:
      neupan-runtime:
        condition: service_healthy
    # 实车不需要 GPU，但在你目前的配置下由于需要跑 Rviz，保留了 X11 挂载
    volumes:
      - ./ros_entrypoint.sh:/ros_entrypoint.sh:ro
      - ../.git:/ws/.git:ro
      - ../.buildcache:/ws/.buildcache
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTH_HOST_FILE:-/tmp/.docker.xauth}:/tmp/.docker.xauth:ro
      - ../src:/ws/src
      - ../scripts:/ws/scripts
      - ../build:/ws/build
      - ../install:/ws/install
      - ../log:/ws/log
      - ../maps:/ws/maps                      # 自动保存的地图（容器生成→宿主机可见）
      - ../launch_logs:/ws/launch_logs        # 启动日志（容器生成→宿主机可见）
      - /dev/bus/usb:/dev/bus/usb             # USB 总线直通，支持 odin 热插拔
    environment:
      HOME: /tmp/home
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/.docker.xauth
      QT_X11_NO_MITSHM: "1"
      TERM: xterm-256color
      ROS_HOME: /tmp/.ros
      ROS_LOG_DIR: /tmp/ros_log
      RCL_LOGGING_DISABLE_FILE_OUTPUT: "1"
