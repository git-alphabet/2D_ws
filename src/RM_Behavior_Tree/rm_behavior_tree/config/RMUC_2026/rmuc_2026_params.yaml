# RMUC 2026 哨兵行为树参数配置文件

# 使用方式：在 launch 文件中通过 parameters 加载本文件
# 所有参数前缀：rmuc_sentry_config.*
# 坐标单位：米 (map 坐标系)

rmuc_sentry_config:

  # 地图坐标
  # 请根据实际比赛场地填写 (单位: 米, map 坐标系)

  home_x: 0.0                    # 己方出生点/复活点 x
  home_y: 0.0                    # 己方出生点/复活点 y

  supply_zone_x: 0.0             # 补给区坐标 x (RFID刷卡 + 导航 + 选点 统一使用)
  supply_zone_y: 0.0             # 补给区坐标 y

  base_buff_x: 0.0               # 己方基地增益区中心 x
  base_buff_y: 0.0               # 己方基地增益区中心 y

  outpost_buff_x: 0.0            # 己方前哨站增益区中心 x
  outpost_buff_y: 0.0            # 己方前哨站增益区中心 y

  fortress_ally_x: 0.0           # 己方堡垒区中心 x
  fortress_ally_y: 0.0           # 己方堡垒区中心 y

  fortress_enemy_x: 0.0          # 敌方堡垒区中心 x
  fortress_enemy_y: 0.0          # 敌方堡垒区中心 y

  central_highland_x: 0.0        # 中央高地中心 x
  central_highland_y: 0.0        # 中央高地中心 y

  ladder_highland_x: 0.0         # 梯形高地中心 x
  ladder_highland_y: 0.0         # 梯形高地中心 y

  defend_anchor_x: 0.0           # 防御锚点 (基地前守卫位置) x
  defend_anchor_y: 0.0           # 防御锚点 y

  # ─────────── 巡逻航点 (3个点组成巡逻三角形) ───────────
  patrol_wpt_0_x: 0.0
  patrol_wpt_0_y: 0.0
  patrol_wpt_1_x: 0.0
  patrol_wpt_1_y: 0.0
  patrol_wpt_2_x: 0.0
  patrol_wpt_2_y: 0.0

  # ─────────── 战斗/生存阈值 ───────────
  hp_low: 180                    # 低血量阈值 (触发 LowHPRetreat 撤退回补给区)
  hp_safe: 280                   # 安全血量阈值 (HoldAndHeal 回血目标)
  heat_high: 210                 # 高热量阈值 (限制开火)
  ammo_low: 80                   # 低弹药阈值 (触发 AmmoPlan)
  ammo_target: 300               # 目标弹药量 (AmmoPlan 补给目标)

  # ─────────── 导航参数 ───────────
  arrive_radius: 0.35            # 到达判定半径 (米)

  # ─────────── 基地防御参数 ───────────
  base_deficit_for_fortress: 500  # 基地血量差值阈值 (判断是否需要堡垒支援)
  enemy_near_base_radius: 2.0    # 敌人距基地威胁半径 (米)

  # ─────────── 目标控制参数 ───────────
  objective_hold_ms: 12000       # 目标点占据等待时间 (毫秒)

  # ─────────── 战斗参数 ───────────
  combat_fire_burst_ms: 180      # 连发开火持续时间 (毫秒)
  combat_fire_pause_ms: 120      # 开火间隔暂停时间 (毫秒)

  # ─────────── 恢复流程参数 (RespawnRecovery) ───────────
  heal_wait_ms: 3000             # 刷卡后等待回血的最长时间 (毫秒)
  heal_min_ratio: 0.6            # 最低回血比例 (达到此比例才退出恢复)
  search_timeout_ms: 5000        # 到达补给区后搜索RFID卡的超时时间 (毫秒)
