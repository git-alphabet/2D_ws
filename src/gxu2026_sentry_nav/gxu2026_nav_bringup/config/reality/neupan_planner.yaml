# NeuPAN planner config for reality (omni robot)
receding: 10
step_time: 0.1
ref_speed: 4.0
device: "cpu"
time_print: false
collision_threshold: 0.1

robot:
  kinematics: "omni"
  max_speed: [8.0, 6.28]
  max_acce: [2.0, 2.0]
  length: 1.6
  width: 2.0

ipath:
  waypoints: []
  curve_style: "line"
  min_radius: 4.0
  loop: false
  arrive_threshold: 0.1
  close_threshold: 0.1
  ind_range: 10
  arrive_index_threshold: 1

pan:
  iter_num: 2
  dune_max_num: 100
  nrmp_max_num: 10
  dune_checkpoint: "/ws/src/gxu2026_sentry_nav/neupan_nav2_controller/model/model_8000.pth"
  iter_threshold: 0.1

adjust:
  q_s: 0.5
  p_u: 1.0
  eta: 15.0
  d_max: 1.0
  d_min: 0.1
  bk: 1.0