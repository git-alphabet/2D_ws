mid360_driver:
  ros__parameters:
    # 点云主题名。
    lidar_topic: livox/lidar
    # 点云坐标系。
    lidar_frame: front_mid360
    # IMU 主题名。
    imu_topic: livox/imu
    # IMU 坐标系。
    imu_frame: front_mid360
    # 是否发布自定义消息。
    publish_custom_msg: true
    # 自定义点云消息主题。
    custom_msg_topic: livox/lidar/pointcloud
    # 点云发布周期，单位秒。
    lidar_publish_time_interval: 0.05
    # 主机地址。
    host_ip: 0.0.0.0
    # 是否在话题名里拼接雷达 IP。
    is_topic_name_with_lidar_ip: false

# mid360 补盲链路开关：auto 表示 odin1 实车默认启用。
mid360_runtime:
  ros__parameters:
    # 是否启用代价地图补盲链路，auto 表示自动判断。
    enable_costmap_additive: "auto"
    # 建图阶段建议单源（odin1）避免装配/时序误差叠加；导航阶段再启用双源补盲。
    # 建图阶段是否启用补盲链路。
    enable_costmap_additive_in_slam: false
    # 导航阶段是否启用补盲链路。
    enable_costmap_additive_in_nav: true
    # Nav2 observation buffer 判定 mid360 补盲源 stale 的周期阈值，单位秒；0.0 表示关闭该告警。
    local_costmap_expected_update_rate: 0.30


pb_navigation_switches:
  ros__parameters:
    # 控制器插件名。
    controller_plugin: "pb_omni_pid_pursuit_controller"
    # 里程计来源标识。
    odometry_source: "odin1"
    # 行为树配置名。
    behavior_tree: "none"

# 机器人描述文件基名：对应 gxu2026_robot_description/resource/xmacro/<name>.sdf.xmacro
robot_description_runtime:
  ros__parameters:
    # 机器人描述文件名。
    robot_description_file: "gxu2026_sentry_robot"

   # 标定辅助节点模式：
    #   off     关闭
    #   slam    仅 SLAM 时启动（默认）
    #   always  任何时候都启动（含纯导航）
    # 标定辅助节点模式。
    calib_helper_mode: "always"
    # 是否不保存 CSV 文件（true 表示跳过 CSV 写入）
    # 是否跳过 CSV 输出。
    calib_no_csv: false

# /auto_aim_yaw -> serial/gimbal_joint_state
# 说明：
# - /auto_aim_yaw是绝对话题名
# - serial/gimbal_joint_state 用相对名，便于在 __ns:=/red_standard_robot1 时自动变成 /red_standard_robot1/serial/gimbal_joint_state
auto_aim_yaw_joint_state_bridge:
  ros__parameters:
    # 输入话题。
    input_topic: /auto_aim_yaw
    # 是否使用带时间戳的消息。
    use_stamped_msg: true
    # 输出话题。
    output_topic: serial/gimbal_joint_state
    # 关节名。
    joint_name: gimbal_yaw_joint

    # 输入角度是否为度。
    input_is_degrees: false
    # 是否反向符号。
    invert_sign: false
    # 数值缩放系数。
    scale: 1.0
    # 固定偏置。
    offset: 0.0

    # 是否启动时立即发布一次。
    publish_on_startup: true
    # 启动时默认 yaw，单位弧度。
    default_yaw_rad: 0.0
    # 建议设置为 >0：当 /auto_aim_yaw 低频或仅在变化时发布时，持续用“当前时间戳”重发 JointState
    # 可以避免 TF 因时间戳过旧而在 tf2 buffer 中失效。
    # 重发频率，单位 Hz。
    publish_rate_hz: 100.0
    # 额外时间戳偏移，单位秒。
    stamp_offset_sec: 0.0

# 与 reality_mid360 框架一致：补齐 gimbal_yaw 关节态链路。
gimbal_yaw_bridge_runtime:
  ros__parameters:
    # 是否启用 gimbal_yaw 关节态桥接。
    enabled: true


# NeuPAN 插件参数已迁移到 neupan_nav2_controller/config/reality/neupan.yaml 维护。
# 切换为 NeuPAN 控制器时，navigation_launch.py 会自动加载该文件并将 FollowPath 合并到 controller_server。
controller_server:
  ros__parameters:
    # 是否使用仿真时间。
    use_sim_time: False
    # 里程计话题。
    odom_topic: odin1/odometry_highfreq
    # 控制器循环频率，单位 Hz。
    controller_frequency: 20.0
    # 控制失败容忍时间，单位秒。
    failure_tolerance: 0.3
    # 进度检查器插件列表。
    progress_checker_plugins: ["progress_checker"]
    # 目标检查器插件列表。
    goal_checker_plugins: ["general_goal_checker"]
    # 路径控制器插件列表。
    controller_plugins: ["FollowPath"]
    progress_checker:
      # 进度检查器插件类型。
      plugin: "nav2_controller::SimpleProgressChecker"
      # 机器人最小移动半径。
      required_movement_radius: 0.5
      # 允许的最短时间窗口，单位秒。
      movement_time_allowance: 10.0
    general_goal_checker:
      # 是否启用状态保持式检查。
      stateful: True
      # 目标检查器插件类型。
      plugin: "nav2_controller::SimpleGoalChecker"
      # 位置容差，单位米。
      xy_goal_tolerance: 0.25
      # 航向容差，单位弧度。
      yaw_goal_tolerance: 6.28

# 控制器参数集合（传统控制器 profile）：这里的 profile 通常与仿真保持一致，便于复现调参。
pb_controller_profiles:
  ros__parameters:
    pb_omni_pid_pursuit_controller:
      # 控制器插件类型。
      plugin: "pb_omni_pid_pursuit_controller::OmniPidPursuitController"
      # 是否打印控制频率调试信息。
      debug_print_control_frequency: false
      # 平移 PID 的比例系数。
      translation_kp: 3.0
      # 平移 PID 的积分系数。
      translation_ki: 0.1
      # 平移 PID 的微分系数。
      translation_kd: 0.3
      # 是否启用旋转控制。
      enable_rotation: true
      # 旋转 PID 的比例系数。
      rotation_kp: 3.0
      # 旋转 PID 的积分系数。
      rotation_ki: 0.1
      # 旋转 PID 的微分系数。
      rotation_kd: 0.3
      # 跟踪控制的 TF 容忍窗口，单位秒。
      transform_tolerance: 0.1
      # 误差积分限幅。
      min_max_sum_error: 1.0
      # 基础前视距离，单位米。
      lookahead_dist: 2.0
      # 是否按速度缩放前视距离。
      use_velocity_scaled_lookahead_dist: true
      # 速度缩放前视时间，单位秒。
      lookahead_time: 1.0
      # 最小前视距离，单位米。
      min_lookahead_dist: 0.5
      # 最大前视距离，单位米。
      max_lookahead_dist: 1.0
      # 是否使用插值。
      use_interpolation: false
      # 是否使用转向对齐。
      use_rotate_to_heading: false
      # 转向对齐阈值。
      use_rotate_to_heading_treshold: 0.1
      # 接近目标时的最小线速度，单位 m/s。
      min_approach_linear_velocity: 0.5
      # 目标接近阶段的速度缩放距离，单位米。
      approach_velocity_scaling_dist: 1.0
      # 线速度下限。
      v_linear_min: -1.5
      # 线速度上限。
      v_linear_max: 1.5
      # 角速度下限。
      v_angular_min: -3.0
      # 角速度上限。
      v_angular_max: 3.0
      # 最小曲率。
      curvature_min: 0.4
      # 最大曲率。
      curvature_max: 0.7
      # 高曲率下的缩放比例。
      reduction_ratio_at_high_curvature: 0.5
      # 前方曲率计算距离，单位米。
      curvature_forward_dist: 0.7
      # 后方曲率计算距离，单位米。
      curvature_backward_dist: 0.3
      # 最大速度缩放系数。
      max_velocity_scaling_factor_rate: 0.9

# 行为树相关（RM 侧）：实车不用 sim time
rm_behavior_tree:
  ros__parameters:
    style: rmuc_01.xml
    # 是否使用仿真时间。
    use_sim_time: False

# point_lio 参数统一由 navigation_launch.py 的 point_lio_config_file 加载，
# reality 默认指向 config/reality/point_lio_obstacle_only.yaml。
# 这里不再保留 point_lio 同名参数块，避免与独立配置文件产生歧义。

# LOAM 接口：把状态估计/点云里程计转换成 Nav2 期望的 odom/base 等
loam_interface:
  ros__parameters:
    # 是否使用仿真时间。
    use_sim_time: False
    # 默认用于 mid360；当 enable_odin1_loam_reframe=true 时，会在 launch 中自动改写为 odin1 输入并输出 lidar_odometry
    # 状态估计话题。
    state_estimation_topic: "aft_mapped_to_init"
    # 输入点云话题。
    registered_scan_topic: "cloud_registered"
    # 输出里程计坐标系。
    odom_frame: "odom"
    # 机器人底盘坐标系。
    base_frame: "base_footprint"
    # 激光雷达坐标系。
    lidar_frame: "front_mid360"
    # 输入语义：
    # - lidar_odom_to_lidar: 兼容 point_lio 旧链路
    # - odom_to_base: odin1 输入是 odom->base_footprint
    # 里程计输入语义。
    input_odom_semantics: "lidar_odom_to_lidar"
    # 点云输入语义：
    # - lidar_odom: 输入点云在 lidar_odom 语义，需要变换到 odom
    # - odom: 输入点云已是 odom 语义（如 odin1/cloud_slam）
    # 点云输入语义。
    input_cloud_semantics: "lidar_odom"
    # 驱动外坐标对齐：x'=-y, y'=x, z'=z；四元数按同一基变换处理。
    # 是否启用 odin 坐标轴对齐。
    align_odin_axes: false
    # true: 只缓存一次 base->lidar（适合固定安装）
    # false: 每帧按时间戳更新 base->lidar（适合 front_odin1 挂在 gimbal_yaw 的动态外参）
    # 是否冻结 base 到 lidar 的 TF 缓存。
    freeze_base_to_lidar_tf: true
    # TF 查询超时时间，单位秒。
    tf_lookup_timeout_sec: 0.2

# mid360 补盲专用 loam 接口：仅服务 mid360 地形链路，不影响 odin1 主导航重组。
loam_interface_mid360:
  ros__parameters:
    # 是否使用仿真时间。
    use_sim_time: False
    # 双雷达拼接长期形态：mid360 投影统一使用 odin1 主 odom，避免双里程计漂移导致错层。
    # 状态估计话题。
    state_estimation_topic: "odin1/odometry_highfreq"
    # 使用 point_lio 的 body frame 点云，避免把 mid360 自身 lidar_odom 语义错误拼接到 odin 主 odom。
    # 输入点云话题。
    registered_scan_topic: "mid360/cloud_registered"
    # 输出里程计坐标系。
    odom_frame: "odom"
    # odin1/odometry_highfreq 的 child_frame 是 base_footprint，因此这里必须与输入里程计语义一致。
    # mid360 安装在 gimbal_yaw 上时，base_footprint->front_mid360 是动态外参，需要按时间戳实时查询。
    base_frame: "base_footprint"
    # 激光雷达坐标系。
    lidar_frame: "front_mid360"
    # 里程计输入语义。
    input_odom_semantics: "odom_to_base"
    # lidar: 输入点云在 lidar/body 语义，使用 odom->lidar 实时位姿投影到 odom。
    # 点云输入语义。
    input_cloud_semantics: "lidar"
    # 是否启用 odin 坐标轴对齐。
    align_odin_axes: false
    # mid360 挂在 gimbal_yaw 时，base_footprint->front_mid360 会随云台转动，不能冻结成单次缓存。
    # 是否冻结 base 到 lidar 的 TF 缓存。
    freeze_base_to_lidar_tf: false
    # TF 查询超时时间，单位秒。
    tf_lookup_timeout_sec: 0.2

# loam 重组开关：把 odin1 里程计整理为 odom/lidar_frame 语义输出。
loam_interface_runtime:
  ros__parameters:
    # 是否启用 odin1 loam 重组。
    enable_odin1_loam_reframe: true
    # 驱动外坐标对齐：用于承接原先在 odin_ros_driver 里的 x'=-y, y'=x 对齐逻辑。
    # auto: 启动时自动检测驱动是否已内置对齐；旧驱动自动开启外部对齐，新驱动自动关闭避免重复旋转。
    # odin1 外部轴对齐开关。
    enable_odin1_external_axis_alignment: "auto"

# 从点云生成 scan（给 slam_toolbox / obstacle_scan 等使用）
sensor_scan_generation:
  ros__parameters:
    # 是否使用仿真时间。
    use_sim_time: False
    # 点云默认仍走 odin1/cloud_slam；若开启 odin1 loam 重组，点云/里程计输入都由 launch 自动切到 loam 输出
    # 激光雷达坐标系。
    lidar_frame: "front_odin1"
    # 机器人底盘坐标系。
    base_frame: "base_footprint"
    # 机器人参考坐标系。
    robot_base_frame: "gimbal_yaw"
    # odin1 实车由 odin_ros_driver 发布 odom->base TF，避免与 sensor_scan_generation 重复发布。
    # 是否发布 base TF。
    publish_base_tf: false

    # TF 调试：打印 TF lookup 是否成功，以及推导出来的 yaw(chassis->gimbal_yaw)
    # 是否打印 TF 调试信息。
    debug_tf: false
    # 调试日志节流周期，单位毫秒。
    debug_tf_throttle_ms: 1000

# sensor_scan_generation 输入源：
# - 默认用 odin1 输出
# - enable_odin1_loam_reframe=true 时，odometry 会被 launch 自动切到 lidar_odometry
sensor_scan_generation_runtime:
  ros__parameters:
    # 输入点云话题。
    registered_scan_topic: "odin1/cloud_slam"
    # 输入里程计话题。
    lidar_odometry_topic: "odin1/odometry_highfreq"

# 地形分析：输出 terrain_map（用于代价地图的点云观测源）
terrain_analysis:
  ros__parameters:
    # 点云体素大小，单位米。
    scanVoxelSize: 0.05                 # 点云下采样
    # 点云时间衰减阈值，单位秒。
    decayTime: 0.2                      # 点云时间差阈值 大于则不会被处理
    # 距离衰减阈值，单位米。
    noDecayDis: 0.0                     # 点云距离阈值 小于该阈值不考虑时间差
    # 清除距离阈值，单位米。
    clearingDis: 0.0                    # 该距离外的点会被清除
    # 是否启用分位数排序地面估计。
    useSorting: True                    # 这个参数开起来就能上坡了；如果 use_sorting,那么就以周围点中的分位点作为地面点，否则以最低点作为地面点；周围其余点相对于地面点的高度作为通过代价，所以对于坡面，有的点的代价是正，有的是负，就相互抵消了；不要与 consider_drop 同时开启，计算上会有冲突
    # 地面分位数参数。
    quantileZ: 0.4                      # useful if use_sorting is enabled.
    # 是否将下凹地形按绝对高度处理。
    considerDrop: False                 # 考虑凹下去的地面,开启则将相对于地面点的高度取绝对值
    # 是否限制地面抬升。
    limitGroundLift: False
    # 允许的最大地面抬升，单位米。
    maxGroundLift: 0.3
    # 是否清除动态物体。
    clearDyObs: True                    # 清除动态物体的话，有动态物体走过的地方就走不了了
    # 动态物体最小距离阈值，单位米。
    minDyObsDis: 0.2                    # 以下参数都是在 clear_dy_obs 的情况下才有用的
    # 动态物体最小角度阈值，单位度。
    minDyObsAngle: 0.0
    # 动态物体相对 Z 下限。
    minDyObsRelZ: -0.3
    # 动态物体相对 Z 绝对值阈值。
    absDyObsRelZThre: 0.4
    # 动态物体最小垂直视场角，单位度。
    minDyObsVFOV: -45.0
    # 动态物体最大垂直视场角，单位度。
    maxDyObsVFOV: 45.0
    # 动态物体最少点数。
    minDyObsPointNum: 1
    # 是否把无数据区域当作障碍。
    noDataObstacle: False               # treat no data as obstacle
    # 无数据块跳过计数。
    noDataBlockSkipNum: 0
    # 单块最少点数。
    minBlockPointNum: 10
    # 车辆高度阈值，单位米。
    vehicleHeight: 0.5                  # 小于车辆高度的点才会进行处理
    # 体素点更新阈值。
    voxelPointUpdateThre: 100
    # 体素时间更新阈值，单位秒。
    voxelTimeUpdateThre: 0.5
    # 相对 Z 最小值。
    minRelZ: -1.5                       # min_rel_z 以及 max_rel_z 限制了有效点云点的Z值范围，用于对天花板和地板进行处理
    # 相对 Z 最大值。
    maxRelZ: 0.5
    # Z 距离比例系数。
    disRatioZ: 0.2                      # Z 值的最大最小范围由这两个值决定，但是并不等于这两个值，是有一个比例关系的，距离机器人越远，限定范围就越大，这其中考虑了坡度

# 地形分析输入源：
# - 默认走 odin1 的 cloud_slam + odometry_highfreq
# - enable_odin1_loam_reframe=true 时，odometry 会被 launch 自动切到 lidar_odometry
# - 若需改源，可在这里改，或 launch 入参覆盖
terrain_analysis_runtime:
  ros__parameters:
    # 输入点云话题。
    registered_scan_topic: "odin1/cloud_slam"
    # 输入里程计话题。
    lidar_odometry_topic: "odin1/odometry_highfreq"

# 地形分析（扩展版）：输出 terrain_map_ext（全局代价地图常用）
terrain_analysis_ext:
  ros__parameters:
    # 点云体素大小，单位米。
    scanVoxelSize: 0.1
    # 点云时间衰减阈值，单位秒。
    decayTime: 0.2
    # 距离衰减阈值，单位米。
    noDecayDis: 0.0
    # 清除距离阈值，单位米。
    clearingDis: 20.0
    # 是否启用分位数排序地面估计。
    useSorting: true
    # 地面分位数参数。
    quantileZ: 0.4
    # 车辆高度阈值，单位米。
    vehicleHeight: 0.8
    # 体素点更新阈值。
    voxelPointUpdateThre: 100
    # ext 链路用于 global_costmap / obstacle_scan。
    # 若该值过大，体素里旧点会在雷达转动后保留过久，表现为全局障碍拖影、scan 发花。
    # 体素时间更新阈值，单位秒。
    voxelTimeUpdateThre: 0.5
    # 相对 Z 下限。
    lowerBoundZ: -1.5
    # 相对 Z 上限。
    upperBoundZ: 0.5
    # Z 距离比例系数。
    disRatioZ: 0.2
    # 是否检查地形连通性。
    checkTerrainConn: False
    # 车体下方地形参考值。
    terrainUnderVehicle: -0.75
    # 地形连通阈值。
    terrainConnThre: 0.5
    # 天花板过滤阈值。
    ceilingFilteringThre: 2.0
    # obstacle_scan / global_costmap 的有效量程到 10m。
    # 这里要覆盖到相同量级，避免 4~10m 区间退回到历史累积 ext 点云，导致全局障碍拖影、发花且刷新不跟手。
    # 局部地形图半径，单位米。
    localTerrainMapRadius: 10.0

terrain_analysis_ext_mid360:
  ros__parameters:
    # mid360 补盲源保留自身观测时间戳；不要跟随 odin1 地形图时间戳。
    # 参考地形图话题。
    publishStampReferenceTopic: ""
    # 消息年龄缩放系数。
    publishStampReferenceAgeAlpha: 1.0
    # 消息年龄下限，单位秒。
    publishStampReferenceAgeClampMinSec: 0.0
    # 消息年龄上限，单位秒。
    publishStampReferenceAgeClampMaxSec: 1.0
    # 输出时间戳偏移，单位秒；时间校准应在驱动或统一时钟层完成。
    publishStampOffsetSec: 0.0
    # 点云体素大小，单位米。
    scanVoxelSize: 0.1
    # 点云时间衰减阈值，单位秒。
    decayTime: 0.2
    # 距离衰减阈值，单位米。
    noDecayDis: 0.0
    # 清除距离阈值，单位米。
    clearingDis: 20.0
    # 是否启用分位数排序地面估计。
    useSorting: true
    # 地面分位数参数。
    quantileZ: 0.4
    # 车辆高度阈值，单位米。
    vehicleHeight: 0.8
    # 体素点更新阈值。
    voxelPointUpdateThre: 100
    # 与主 ext 链路保持一致，减少补盲全局层在云台转动时的历史拖影。
    # 体素时间更新阈值，单位秒。
    voxelTimeUpdateThre: 0.5
    # 相对 Z 下限。
    lowerBoundZ: -1.5
    # 相对 Z 上限。
    upperBoundZ: 0.5
    # Z 距离比例系数。
    disRatioZ: 0.2
    # 是否检查地形连通性。
    checkTerrainConn: False
    # 车体下方地形参考值。
    terrainUnderVehicle: -0.75
    # 地形连通阈值。
    terrainConnThre: 0.5
    # 天花板过滤阈值。
    ceilingFilteringThre: 2.0
    # 与主 ext 链路保持一致，确保 10m 内优先使用当前局部地形而不是历史累积。
    # 局部地形图半径，单位米。
    localTerrainMapRadius: 10.0

# mid360 局部地形图保留自身观测时间戳，由 costmap/TF 容忍窗口处理真实链路延迟。
terrain_analysis_mid360:
  ros__parameters:
    # 参考地形图话题。
    publishStampReferenceTopic: ""
    # 消息年龄缩放系数。
    publishStampReferenceAgeAlpha: 1.0
    # 消息年龄下限，单位秒。
    publishStampReferenceAgeClampMinSec: 0.0
    # 消息年龄上限，单位秒。
    publishStampReferenceAgeClampMaxSec: 1.0
    # 输出时间戳偏移，单位秒；时间校准应在驱动或统一时钟层完成。
    publishStampOffsetSec: 0.0
    # mid360 补盲只服务局部 costmap，使用短衰减和较低高度窗口，避免 terrain_analysis 累积过多历史点造成输出空洞。
    # 点云体素大小，单位米。
    scanVoxelSize: 0.08
    # 点云时间衰减阈值，单位秒。
    decayTime: 0.2
    # 距离衰减阈值，单位米。
    noDecayDis: 0.0
    # 清除距离阈值，单位米。
    clearingDis: 0.0
    # 是否启用分位数排序地面估计。
    useSorting: true
    # 地面分位数参数。
    quantileZ: 0.4
    # 是否将下凹地形按绝对高度处理。
    considerDrop: false
    # 是否限制地面抬升。
    limitGroundLift: false
    # 允许的最大地面抬升，单位米。
    maxGroundLift: 0.3
    # 补盲链路关闭动态障碍清理，减少局部地形分析的突发计算量。
    clearDyObs: false
    # 动态物体最小距离阈值，单位米。
    minDyObsDis: 0.2
    # 动态物体最小角度阈值，单位度。
    minDyObsAngle: 0.0
    # 动态物体相对 Z 下限。
    minDyObsRelZ: -0.3
    # 动态物体相对 Z 绝对值阈值。
    absDyObsRelZThre: 0.4
    # 动态物体最小垂直视场角，单位度。
    minDyObsVFOV: -45.0
    # 动态物体最大垂直视场角，单位度。
    maxDyObsVFOV: 45.0
    # 动态物体最少点数。
    minDyObsPointNum: 1
    # 是否把无数据区域当作障碍。
    noDataObstacle: false
    # 无数据块跳过计数。
    noDataBlockSkipNum: 0
    # 单块最少点数。
    minBlockPointNum: 10
    # 车辆高度阈值，单位米。
    vehicleHeight: 0.5
    # 体素点更新阈值。
    voxelPointUpdateThre: 100
    # 体素时间更新阈值，单位秒。
    voxelTimeUpdateThre: 0.5
    # 相对 Z 最小值。
    minRelZ: -1.5
    # 相对 Z 最大值。
    maxRelZ: 0.5
    # Z 距离比例系数。
    disRatioZ: 0.2

# 假速度/坐标变换：把 Nav2 内部期望的底盘速度/局部路径做一层适配
fake_vel_transform:
  ros__parameters:
    # 是否使用仿真时间。
    use_sim_time: False
    # 里程计话题。
    odom_topic: "odometry"
    # Nav2 内部规划使用 gimbal_yaw，经过该节点转换后对外发布 fake 底盘框架。
    # 机器人参考坐标系。
    robot_base_frame: "gimbal_yaw"
    # fake 底盘坐标系。
    fake_robot_base_frame: "gimbal_yaw_fake"
    # 输入是 controller 结果速度，输出是底盘最终执行速度。
    # 局部规划话题。
    local_plan_topic: "local_plan"
    # 输入速度话题。
    input_cmd_vel_topic: "cmd_vel_nav2_result"
    # 输出速度话题。
    output_cmd_vel_topic: "cmd_vel"
    # 底盘控制话题。
    robot_control_topic: "robot_control"
    # 测试开关：true=移动时关闭小陀螺，false=移动时也保留小陀螺
    # 是否在移动时关闭小陀螺。
    disable_spin_while_moving: true
    # 初始小陀螺速度，单位 rad/s。
    init_spin_speed: 3.0
    # 减速带速度下限控制：进入 speed_bump 区域后，线速度低于该值会被抬高
    # 是否启用减速带最低速度限制。
    enable_speed_bump_min_speed: true
    # 减速带角速度限制：进入 speed_bump 区域后，强制 angular.z=0
    # 是否启用减速带角速度置零。
    enable_speed_bump_zero_angular_z: true
    # 减速带最低线速度，单位 m/s。
    speed_bump_min_linear_speed: 1.5
    # 减速带地图坐标系。
    speed_bump_map_frame: "map"
    # 减速带区域名。
    speed_bump_zone_name: "speed_bump"
    # 减速带语义区域文件。
    speed_bump_zones_file: "/ws/src/gxu2026_sentry_nav/gxu2026_nav_bringup/config/simulation/semantic_zones.yaml"

# 非线性小陀螺（实车）：同仿真，发布 cmd_spin（Float32，单位 rad/s）
nonlinear_spin_publisher:
  ros__parameters:
    # 是否使用仿真时间。
    use_sim_time: False

    # 总开关：true 才会开始发布 cmd_spin
    # 是否启用小陀螺输出。
    enabled: false

    # 触发策略：收到第一条 Nav2 local_plan 后开始小陀螺，之后不停止
    # 是否在首次触发后持续发布。
    start_on_first_trigger: true
    # 触发话题。
    start_trigger_topic: "cmd_vel_nav2_result"
    # 触发消息类型。
    start_trigger_msg_type: "geometry_msgs/Twist"
    # 是否要求触发消息非零。
    trigger_require_nonzero: false
    # 小陀螺输出话题。
    cmd_spin_topic: "cmd_spin"
    # 小陀螺发布频率，单位 Hz。
    publish_rate_hz: 50.0

    # 变频变幅正弦叠加：center_speed + A1*sin(phi1) + A2*sin(phi2 + offset)
    center_speed: 3.14            # 中心角速度(rad/s)
    range_speed: 2.0              # 总振幅基准(rad/s)
    primary_amp_ratio: 0.65       # 主正弦分量振幅占比(会和 secondary 归一化)
    secondary_amp_ratio: 0.35     # 次正弦分量振幅占比
    primary_freq_hz: 0.8          # 主正弦基础频率(Hz)
    secondary_freq_hz: 1.7        # 次正弦基础频率(Hz)
    harmonic_phase_offset: 1.57   # 次正弦相位偏移(rad)
    amp_scale_min: 0.75           # 振幅缩放下限
    amp_scale_max: 1.20           # 振幅缩放上限
    freq_scale_min: 0.80          # 频率缩放下限
    freq_scale_max: 1.20          # 频率缩放上限
    modulation_slew_rate: 2.2     # 幅频缩放变化斜率上限(每秒)

    # 每隔 target_update_period 重采样幅频缩放目标，并按 modulation_slew_rate 平滑跟踪
    target_update_period: 0.15    # 重采样周期(s)
    accel_limit: 16.0             # 输出角速度加速度限幅(rad/s^2)

    max_abs_speed: 4.8            # 输出绝对值上限(rad/s)
    min_abs_speed: 2.8            # 输出绝对值下限(rad/s)，避免转速贴近 0
    seed: 1                       # 随机种子(0 为每次随机)
    start_delay_sec: 0.5          # 节点启动后延迟生效时间(s)

# PointCloud2 -> LaserScan：用于传统 2D 代价地图/SLAM
pointcloud_to_laserscan:
  ros__parameters:
    # 是否使用仿真时间。
    use_sim_time: False
    # 投影目标坐标系。
    target_frame: base_footprint
    # 导航阶段点云链路存在约 0.25~0.30s 滞后，适当放宽 TF 容忍窗口。
    # TF 容忍窗口，单位秒。
    transform_tolerance: 0.3
    # 最低高度过滤，单位米。
    min_height: -0.5
    # 最高高度过滤，单位米。
    max_height: 6.0
    # terrain_analysis 输出的点云 intensity = 相对地面高度(disZ)，单位米。
    # min_intensity=0.1 过滤地面起伏 <10cm，避免把平整地面误判为障碍物。
    # 最小强度阈值。
    min_intensity: 0.1
    # 最大强度阈值。
    max_intensity: 2.0
    # 扫描起始角。
    angle_min: -3.1415926                   # -M_PI/2
    # 扫描结束角。
    angle_max: 3.1415926                    # M_PI/2
    # 角度分辨率。
    angle_increment: 0.00872665             # M_PI/360.0
    # 扫描时间，单位秒。
    scan_time: 0.05
    # 最小量测距离，单位米。
    range_min: 0.3
    # 最大量测距离，单位米。
    range_max: 10.0
    # 是否使用无穷远值表示无回波。
    use_inf: true

# mid360 的 PointCloud2 -> LaserScan 参数必须与主链路保持一致，
# 否则 scan_additive_adapter 会因角度/分辨率不兼容回退到仅 primary(odin1)。
pointcloud_to_laserscan_mid360:
  ros__parameters:
    # 是否使用仿真时间。
    use_sim_time: False
    # 投影目标坐标系。
    target_frame: base_footprint
    # 补盲 scan 只保留最新一帧，避免 TF filter / 执行器抖动时排队旧 terrain_map_mid360。
    # 输入队列长度。
    queue_size: 1
    # TF 容忍窗口，单位秒。
    transform_tolerance: 0.3
    # 最低高度过滤，单位米。
    min_height: -0.5
    # 最高高度过滤，单位米。
    max_height: 6.0
    # terrain_analysis 输出的点云 intensity = 相对地面高度(disZ)，单位米。
    # 与 odin1 主链路一致：过滤地面起伏 <10cm，避免把平整地面误判为障碍物。
    # 最小强度阈值。
    min_intensity: 0.1
    # 最大强度阈值。
    max_intensity: 2.0
    # 扫描起始角。
    angle_min: -3.1415926
    # 扫描结束角。
    angle_max: 3.1415926
    # 角度分辨率。
    angle_increment: 0.00872665
    # 扫描时间，单位秒。
    scan_time: 0.05
    # 最小量测距离，单位米。
    range_min: 0.05
    # 最大量测距离，单位米。
    range_max: 10.0
    # 是否使用无穷远值表示无回波。
    use_inf: true

# obstacle_scan 主链路开关（pointcloud_to_laserscan：terrain_map_ext -> scan）。
obstacle_scan_runtime:
  ros__parameters:
    # 是否启用 obstacle_scan 生成。
    enabled: true
    # 输出 scan 话题。
    output_scan_topic: "scan_odin1"

# scan 融合开关：scan_odin1 + scan_mid360 -> obstacle_scan。
scan_additive_runtime:
  ros__parameters:
    # 是否启用 scan 融合。
    enabled: true
    # 建图阶段默认关闭，导航阶段默认开启。
    # 建图阶段是否启用融合。
    enabled_in_slam: false
    # 导航阶段是否启用融合。
    enabled_in_nav: true

# scan 融合节点参数：可在配置文件调节，不依赖 launch 硬编码。
scan_additive_adapter:
  ros__parameters:
    # 主 scan 话题。
    primary_scan_topic: scan_odin1
    # 次 scan 话题。
    secondary_scan_topic: scan_mid360
    # 输出 scan 话题。
    output_scan_topic: obstacle_scan
    # mid360 频率低于 odin1 时，适当放宽超时可避免 secondary 被频繁判定 stale。
    # 次级 scan 超时阈值，单位秒。
    secondary_timeout_sec: 1.0
    # 主 scan 缺失时是否仍发布次级 scan。
    publish_secondary_when_primary_missing: true

# SLAM Toolbox：mapping 模式时发布 map/odom 等；scan_topic 要与上游生成一致
slam_toolbox:
  ros__parameters:
    # https://github.com/SteveMacenski/slam_toolbox/tree/humble?#configuration
    # 求解器插件。
    solver_plugin: solver_plugins::CeresSolver
    # Ceres 线性求解器类型。
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    # Ceres 预条件器。
    ceres_preconditioner: SCHUR_JACOBI
    # Ceres 信赖域策略。
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    # Ceres dogleg 类型。
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    # Ceres 损失函数。
    ceres_loss_function: None

    # 里程计坐标系。
    odom_frame: odom
    # 地图坐标系。
    map_frame: map
    # 机器人底盘坐标系。
    base_frame: base_footprint
    # 输入 scan 话题。
    scan_topic: obstacle_scan
    # 是否启用地图保存器。
    use_map_saver: true
    # SLAM 模式。
    mode: mapping

    # if you'd like to immediately start continuing a map at a given pose
    # or at the dock, but they are mutually exclusive, if pose is given
    # will use pose
    # map_file_name: test_steve
    # map_start_pose: [0.0, 0.0, 0.0]
    # map_start_at_dock: true

    debug_logging: false
    # 扫描节流倍数。
    throttle_scans: 1
    # 扫描队列长度。
    scan_queue_size: 10
    # 里程计发布周期，单位秒；为 0 表示不发布。
    transform_publish_period: 0.0                # if 0 never publishes odometry
    # 地图更新间隔，单位秒。
    map_update_interval: 0.5
    # 地图分辨率，单位米/格。
    resolution: 0.05
    # 最小激光量测距离，单位米。
    min_laser_range: 0.3                         # for rastering images
    # 最大激光量测距离，单位米。
    max_laser_range: 10.0                         # for rastering images
    # 最小扫描时间间隔，单位秒。
    minimum_time_interval: 0.2
    # TF 超时时间，单位秒。
    transform_timeout: 0.2
    # TF 缓存时长，单位秒。
    tf_buffer_duration: 10.
    # 运行所需堆栈大小。
    stack_size_to_use: 40000000                   # program needs a larger stack size to serialize large maps
    # 是否启用交互模式。
    enable_interactive_mode: true

    # General Parameters
    # 是否使用 scan matching。
    use_scan_matching: false
    # 是否使用扫描重心。
    use_scan_barycenter: true
    # 最小行进距离，单位米。
    minimum_travel_distance: 0.1
    # 最小行进航向，单位弧度。
    minimum_travel_heading: 0.1
    # 扫描缓冲长度。
    scan_buffer_size: 10
    # 扫描最大匹配距离，单位米。
    scan_buffer_maximum_scan_distance: 10.0
    # fine 级链接最小响应值。
    link_match_minimum_response_fine: 0.1
    # 链接扫描最大距离，单位米。
    link_scan_maximum_distance: 1.5
    # 回环搜索最大距离，单位米。
    loop_search_maximum_distance: 3.0
    # 是否启用回环闭合。
    do_loop_closing: false
    # 回环链最小长度。
    loop_match_minimum_chain_size: 10
    # coarse 级回环匹配方差上限。
    loop_match_maximum_variance_coarse: 3.0
    # coarse 级最小响应值。
    loop_match_minimum_response_coarse: 0.35
    # fine 级最小响应值。
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters - Correlation Parameters
    # 相关性搜索空间维度。
    correlation_search_space_dimension: 0.5
    # 相关性搜索分辨率。
    correlation_search_space_resolution: 0.01
    # 相关性搜索模糊偏差。
    correlation_search_space_smear_deviation: 0.1

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 8.0
    # 回环搜索空间分辨率。
    loop_search_space_resolution: 0.05
    # 回环搜索空间模糊偏差。
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    # 距离方差惩罚。
    distance_variance_penalty: 5.5
    # 角度方差惩罚。
    angle_variance_penalty: 5.0

    # fine 搜索角偏移。
    fine_search_angle_offset: 0.00349
    # coarse 搜索角偏移。
    coarse_search_angle_offset: 0.349
    # coarse 搜索角分辨率。
    coarse_angle_resolution: 0.0349
    # 最小角度惩罚。
    minimum_angle_penalty: 0.9
    # 最小距离惩罚。
    minimum_distance_penalty: 0.5
    # 是否启用响应扩展。
    use_response_expansion: true

# Nav2 BT Navigator：行为树导航主入口
bt_navigator:
  ros__parameters:
    # 是否使用仿真时间。
    use_sim_time: False
    # 全局参考坐标系。
    global_frame: map
    # 机器人底盘基坐标系。
    robot_base_frame: gimbal_yaw_fake
    # 里程计话题。
    odom_topic: odin1/odometry_highfreq
    # BT 主循环周期，单位秒。
    bt_loop_duration: 10
    # 默认服务超时时间，单位秒。
    default_server_timeout: 100
    # 等待服务可用超时时间，单位毫秒。
    wait_for_service_timeout: 1000
    # 默认导航到点位 BT 文件。
    default_nav_to_pose_bt_xml: $(find-pkg-share gxu2026_nav_bringup)/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
    # 默认多点导航 BT 文件。
    default_nav_through_poses_bt_xml: $(find-pkg-share gxu2026_nav_bringup)/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml
    # BT 插件库列表。
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
