# 代价地图（local）：rolling window + 障碍物/地形点云
local_costmap:
  local_costmap:
    ros__parameters:
      # 是否使用仿真时间。
      use_sim_time: False
      # 局部代价地图更新频率，单位 Hz。
      update_frequency: 15.0
      # 局部代价地图发布频率，单位 Hz。
      publish_frequency: 8.0
      # 局部代价地图使用的全局参考坐标系。
      global_frame: odom
      # 局部代价地图中的机器人底盘基坐标系。
      robot_base_frame: gimbal_yaw_fake
      # 代价地图查询 TF 的容忍窗口，覆盖链路延迟峰值。
      transform_tolerance: 0.4
      # 局部代价地图是否采用滚动窗口。
      rolling_window: true
      # 滚动窗口宽度，单位米。
      width: 5
      # 滚动窗口高度，单位米。
      height: 5
      # 代价地图分辨率，单位米/格。
      resolution: 0.05
      # 机器人外接圆半径，用于 footprint 近似。
      robot_radius: 0.3
      # 局部代价地图加载的插件顺序。
      plugins: ["static_layer", "intensity_voxel_layer", "inflation_layer"]
      intensity_voxel_layer:
        # 体素代价层的插件类型。
        plugin: pb_nav2_costmap_2d::IntensityVoxelLayer
        # 是否启用该层。
        enabled: true
        # 是否跟踪未知区域。
        track_unknown_space: true
        # 是否在 footprint 内清除障碍。
        footprint_clearing_enabled: true
        # 仅保留短 TF 过滤窗口；过大会让 MessageFilter 对未来时间戳额外等待。
        tf_filter_tolerance: 0.05
        # 是否发布体素地图调试数据。
        publish_voxel_map: false
        # 多源观测的融合方式。
        combination_method: 1
        # 提高到 1，抑制高速运动时单点噪声闪烁
        mark_threshold: 1
        # 体素栅格原点的 Z 值。
        origin_z: 0.0
        # 未知高度阈值。
        unknown_threshold: 5
        # Z 方向分辨率，单位米。
        z_resolution: 0.05
        # Z 方向体素层数。
        z_voxels: 16
        # 障碍物允许的最低高度。
        min_obstacle_height: 0.0
        # 障碍物允许的最高高度。
        max_obstacle_height: 2.0
        # 障碍物强度下限。
        min_obstacle_intensity: 0.1
        # 障碍物强度上限。
        max_obstacle_intensity: 2.0
        # 使用 odin1 + mid360 的地形点云共同作为观测源，mid360 用于补盲
        # 参与体素层更新的观测源列表。
        observation_sources: terrain_map terrain_map_mid360
        terrain_map:
          # 该观测源的数据类型。
          data_type: PointCloud2
          # 该观测源订阅的话题。
          topic: /terrain_map
          # 是否将该源用于标记障碍。
          marking: true
          # 是否将该源用于清除障碍。
          clearing: true
          # 仅使用最新观测，配合 terrain_analysis 的 decayTime 实现时间清除
          # 该观测源的历史缓存时长。
          observation_persistence: 0.0
          # 期望更新周期阈值，单位秒；超过该时间未收到有效观测会触发 stale 告警。
          expected_update_rate: 0.20
          # 该源允许的最低障碍高度。
          min_obstacle_height: 0.0
          # 该源允许的最高障碍高度。
          max_obstacle_height: 2.0
          # 该源用于标记障碍的最大距离。
          obstacle_max_range: 5.0
          # 该源用于标记障碍的最小距离。
          obstacle_min_range: 0.50
          # 该源用于射线清除的最大距离。
          raytrace_max_range: 5.0
          # 该源用于射线清除的最小距离。
          raytrace_min_range: 0.50
        terrain_map_mid360:
          # 该观测源的数据类型。
          data_type: PointCloud2
          # 该观测源订阅的话题。
          topic: /terrain_map_mid360
          # 是否将该源用于标记障碍。
          marking: true
          # 是否将该源用于清除障碍。
          clearing: true
          # 该观测源的历史缓存时长。
          observation_persistence: 0.0
          # 期望更新周期阈值，单位秒。
          expected_update_rate: 0.30
          # 该源允许的最低障碍高度。
          min_obstacle_height: 0.0
          # 该源允许的最高障碍高度。
          max_obstacle_height: 2.0
          # 该源用于标记障碍的最大距离。
          obstacle_max_range: 5.0
          # 该源用于标记障碍的最小距离。
          obstacle_min_range: 0.50
          # 该源用于射线清除的最大距离。
          raytrace_max_range: 5.0
          # 该源用于射线清除的最小距离。
          raytrace_min_range: 0.50
      static_layer:
        # 静态层插件类型。
        plugin: "nav2_costmap_2d::StaticLayer"
        # 是否启用静态层。
        enabled: False
        # 是否订阅 transient local 的地图消息。
        map_subscribe_transient_local: True
      inflation_layer:
        # 膨胀层插件类型。
        plugin: "nav2_costmap_2d::InflationLayer"
        # 膨胀代价衰减系数。
        cost_scaling_factor: 4.0
        # 障碍物膨胀半径，单位米。
        inflation_radius: 0.6
      # 是否总是发布完整代价地图。
      always_send_full_costmap: False

# 代价地图（global）：通常使用 map 坐标系，观测源常来自 terrain_map_ext
global_costmap:
  global_costmap:
    ros__parameters:
      # 是否使用仿真时间。
      use_sim_time: False
      # 全局代价地图更新频率，单位 Hz。
      update_frequency: 10.0
      # 全局代价地图发布频率，单位 Hz。
      publish_frequency: 5.0
      # 全局代价地图使用的参考坐标系。
      global_frame: map
      # 全局代价地图中的机器人底盘基坐标系。
      robot_base_frame: gimbal_yaw_fake
      # 导航重定位场景下 map->odom 切换与点云延迟叠加，需更宽容忍窗口。
      transform_tolerance: 0.3
      # 全局代价地图是否采用滚动窗口。
      rolling_window: true
      # 滚动窗口宽度，单位米。
      width: 20
      # 滚动窗口高度，单位米。
      height: 20
      # 机器人外接圆半径，用于 footprint 近似。
      robot_radius: 0.3
      # 全局代价地图分辨率，单位米/格。
      resolution: 0.05
      # 是否跟踪未知区域。
      track_unknown_space: true
      # 全局代价地图加载的插件顺序。
      plugins: ["static_layer", "intensity_voxel_layer", "inflation_layer"]
      intensity_voxel_layer:
        # 体素代价层的插件类型。
        plugin: pb_nav2_costmap_2d::IntensityVoxelLayer
        # 是否启用该层。
