pb_navigation_switches:
  ros__parameters:
    # 控制器插件名。
    controller_plugin: "neupan_nav2_controller"
    # 里程计来源标识。
    odometry_source: "odin1"
    # 行为树配置名。
    behavior_tree: "none"

# NeuPAN 插件参数已迁移到 neupan_nav2_controller/config/reality/neupan.yaml 维护。
# 切换为 NeuPAN 控制器时，navigation_launch.py 会自动加载该文件并将 FollowPath 合并到 controller_server。
controller_server:
  ros__parameters:
    # 是否使用仿真时间。
    use_sim_time: False
    # 里程计话题。
    odom_topic: odin1/odometry
    # 控制器循环频率，单位 Hz。
    controller_frequency: 20.0
    # 控制失败容忍时间，单位秒。
    failure_tolerance: 0.3
    # 进度检查器插件列表。
    progress_checker_plugins: ["progress_checker"]
    # 目标检查器插件列表。
    goal_checker_plugins: ["general_goal_checker"]
    # 路径控制器插件列表。
    controller_plugins: ["FollowPath"]
    progress_checker:
      # 进度检查器插件类型。
      plugin: "nav2_controller::SimpleProgressChecker"
      # 机器人最小移动半径。
      required_movement_radius: 0.5
      # 允许的最短时间窗口，单位秒。
      movement_time_allowance: 10.0
    general_goal_checker:
      # 是否启用状态保持式检查。
      stateful: True
      # 目标检查器插件类型。
      plugin: "nav2_controller::SimpleGoalChecker"
      # 位置容差，单位米。
      xy_goal_tolerance: 0.25
      # 航向容差，单位弧度。
      yaw_goal_tolerance: 6.28

# 控制器参数集合（传统控制器 profile）：这里的 profile 通常与仿真保持一致，便于复现调参。
pb_controller_profiles:
  ros__parameters:
    neupan_nav2_controller:
      plugin: "nav2_neupan_controller::NeuPANController"
      dune_model_path: "/ws/src/gxu2026_sentry_nav/neupan_nav2_controller/model/model_8000.pth"
      neupan_config_path: "/ws/src/gxu2026_sentry_nav/gxu2026_nav_bringup/config/reality/neupan_planner.yaml"
      max_linear_velocity: 2.5
      max_angular_velocity: 3.0
      robot_type: "omni"
      marker_size: 0.05
      marker_z: 1.0
      
    pb_omni_pid_pursuit_controller:
      # 控制器插件类型。
      plugin: "pb_omni_pid_pursuit_controller::OmniPidPursuitController"
      # 是否打印控制频率调试信息。
      debug_print_control_frequency: false
      # 平移 PID 的比例系数。
      translation_kp: 3.0
      # 平移 PID 的积分系数。
      translation_ki: 0.1
      # 平移 PID 的微分系数。
      translation_kd: 0.3
      # 是否启用旋转控制。
      enable_rotation: true
      # 旋转 PID 的比例系数。
      rotation_kp: 3.0
      # 旋转 PID 的积分系数。
      rotation_ki: 0.1
      # 旋转 PID 的微分系数。
      rotation_kd: 0.3
      # 跟踪控制的 TF 容忍窗口，单位秒。
      transform_tolerance: 0.1
      # 误差积分限幅。
      min_max_sum_error: 1.0
      # 基础前视距离，单位米。
      lookahead_dist: 2.0
      # 是否按速度缩放前视距离。
      use_velocity_scaled_lookahead_dist: true
      # 速度缩放前视时间，单位秒。
      lookahead_time: 1.5
      # 最小前视距离，单位米。
      min_lookahead_dist: 0.5
      # 最大前视距离，单位米。
      max_lookahead_dist: 2.0
      # 是否使用插值。
      use_interpolation: false
      # 是否使用转向对齐。
      use_rotate_to_heading: false
      # 转向对齐阈值。
      use_rotate_to_heading_treshold: 0.1
      # 接近目标时的最小线速度，单位 m/s。
      min_approach_linear_velocity: 0.5
      # 目标接近阶段的速度缩放距离，单位米。
      approach_velocity_scaling_dist: 1.0
      # 线速度下限。
      v_linear_min: -2.5
      # 线速度上限。
      v_linear_max: 2.5
      # 角速度下限。
      v_angular_min: -3.0
      # 角速度上限。
      v_angular_max: 3.0
      # 最小曲率。
      curvature_min: 0.4
      # 最大曲率。
      curvature_max: 0.7
      # 高曲率下的缩放比例。
      reduction_ratio_at_high_curvature: 0.5
      # 前方曲率计算距离，单位米。
      curvature_forward_dist: 0.7
      # 后方曲率计算距离，单位米。
      curvature_backward_dist: 0.3
      # 最大速度缩放系数。
      max_velocity_scaling_factor_rate: 0.9

# 从点云生成 scan（给 slam_toolbox / obstacle_scan 等使用）
sensor_scan_generation:
  ros__parameters:
    # 是否使用仿真时间。
    use_sim_time: False
    # 激光雷达坐标系。
    lidar_frame: "front_odin1"
    # 机器人底盘坐标系。
    base_frame: "base_footprint"
    # 机器人参考坐标系。
    robot_base_frame: "gimbal_yaw"
    # odin1 实车由 odin_ros_driver 发布 odom->base TF，避免与 sensor_scan_generation 重复发布。
    # 是否发布 base TF。
    publish_base_tf: false

    # TF 调试：打印 TF lookup 是否成功，以及推导出来的 yaw(chassis->gimbal_yaw)
    # 是否打印 TF 调试信息。
    debug_tf: false
    # 调试日志节流周期，单位毫秒。
    debug_tf_throttle_ms: 1000

# sensor_scan_generation 输入源：
sensor_scan_generation_runtime:
  ros__parameters:
    # 输入点云话题。
    registered_scan_topic: "odin1/cloud_slam"
    # 输入里程计话题。
    lidar_odometry_topic: "odin1/odometry"

# 地形分析：输出 terrain_map（用于代价地图的点云观测源）
terrain_analysis:
  ros__parameters:
    # 点云体素大小，单位米。
    scanVoxelSize: 0.05                 # 点云下采样
    # 点云时间衰减阈值，单位秒。
    decayTime: 0.2                      # 点云时间差阈值 大于则不会被处理
    # 距离衰减阈值，单位米。
    noDecayDis: 0.0                     # 点云距离阈值 小于该阈值不考虑时间差
    # 清除距离阈值，单位米。
    clearingDis: 0.0                    # 该距离外的点会被清除
    # 是否启用分位数排序地面估计。
    useSorting: True                    # 这个参数开起来就能上坡了；如果 use_sorting,那么就以周围点中的分位点作为地面点，否则以最低点作为地面点；周围其余点相对于地面点的高度作为通过代价，所以对于坡面，有的点的代价是正，有的是负，就相互抵消了；不要与 consider_drop 同时开启，计算上会有冲突
    # 地面分位数参数。
    quantileZ: 0.4                      # useful if use_sorting is enabled.
    # 是否将下凹地形按绝对高度处理。
    considerDrop: False                 # 考虑凹下去的地面,开启则将相对于地面点的高度取绝对值
    # 是否限制地面抬升。
    limitGroundLift: False
    # 允许的最大地面抬升，单位米。
    maxGroundLift: 0.3
    # 是否清除动态物体。
    clearDyObs: True                    # 清除动态物体的话，有动态物体走过的地方就走不了了
    # 动态物体最小距离阈值，单位米。
    minDyObsDis: 0.2                    # 以下参数都是在 clear_dy_obs 的情况下才有用的
    # 动态物体最小角度阈值，单位度。
    minDyObsAngle: 0.0
    # 动态物体相对 Z 下限。
    minDyObsRelZ: -0.3
    # 动态物体相对 Z 绝对值阈值。
    absDyObsRelZThre: 0.4
    # 动态物体最小垂直视场角，单位度。
    minDyObsVFOV: -45.0
    # 动态物体最大垂直视场角，单位度。
    maxDyObsVFOV: 45.0
    # 动态物体最少点数。
    minDyObsPointNum: 1
    # 是否把无数据区域当作障碍。
    noDataObstacle: False               # treat no data as obstacle
    # 无数据块跳过计数。
    noDataBlockSkipNum: 0
    # 单块最少点数。
    minBlockPointNum: 10
    # 车辆高度阈值，单位米。
    vehicleHeight: 0.5                  # 小于车辆高度的点才会进行处理
    # 体素点更新阈值。
    voxelPointUpdateThre: 100
    # 体素时间更新阈值，单位秒。
    voxelTimeUpdateThre: 0.5
    # 相对 Z 最小值。
    minRelZ: -1.5                       # min_rel_z 以及 max_rel_z 限制了有效点云点的Z值范围，用于对天花板和地板进行处理
    # 相对 Z 最大值。
    maxRelZ: 0.5
    # Z 距离比例系数。
    disRatioZ: 0.2                      # Z 值的最大最小范围由这两个值决定，但是并不等于这两个值，是有一个比例关系的，距离机器人越远，限定范围就越大，这其中考虑了坡度

# 地形分析输入源：
# - 默认走 odin1 的 cloud_slam + odometry
# - 若需改源，可在这里改，或 launch 入参覆盖
terrain_analysis_runtime:
  ros__parameters:
    # 是否启用地形分析节点（terrain_analysis + terrain_analysis_ext）。
    # 禁用后（2D 模式）需手动修改 costmap 的 observation_sources topic
    # 为 terrain_registered_scan_topic 的值（如 /odin1/cloud_slam）。
    # 2D 模式不融合，只取 odin1 数据。
    enable_terrain_analysis: true
    # 输入点云话题。
    registered_scan_topic: "odin1/cloud_slam"
    # 输入里程计话题。
    lidar_odometry_topic: "odin1/odometry"

# 地形分析（扩展版）：输出 terrain_map_ext（全局代价地图常用）
terrain_analysis_ext:
  ros__parameters:
    # 点云体素大小，单位米。
    scanVoxelSize: 0.1
    # 点云时间衰减阈值，单位秒。
    decayTime: 0.2
    # 距离衰减阈值，单位米。
    noDecayDis: 0.0
    # 清除距离阈值，单位米。
    clearingDis: 20.0
    # 是否启用分位数排序地面估计。
    useSorting: true
    # 地面分位数参数。
    quantileZ: 0.4
    # 车辆高度阈值，单位米。
    vehicleHeight: 0.8
    # 体素点更新阈值。
    voxelPointUpdateThre: 50
    # ext 链路用于 global_costmap / obstacle_scan。
    # voxelTimeUpdateThre 必须 <= decayTime，否则 decayTime 形同虚设。
    # 体素时间更新阈值，单位秒。
    voxelTimeUpdateThre: 0.2
    # 相对 Z 下限。
    lowerBoundZ: -1.5
    # 相对 Z 上限。
    upperBoundZ: 0.5
    # Z 距离比例系数。
    disRatioZ: 0.2
    # 是否检查地形连通性。
    checkTerrainConn: False
    # 车体下方地形参考值。
    terrainUnderVehicle: -0.75
    # 地形连通阈值。
    terrainConnThre: 0.5
    # 天花板过滤阈值。
    ceilingFilteringThre: 2.0
    # obstacle_scan / global_costmap 的有效量程到 10m。
    # 这里要覆盖到相同量级，避免 4~10m 区间退回到历史累积 ext 点云，导致全局障碍拖影、发花且刷新不跟手。
    # 局部地形图半径，单位米。
    localTerrainMapRadius: 10.0

# PointCloud2 -> LaserScan：用于传统 2D 代价地图/SLAM
pointcloud_to_laserscan:
  ros__parameters:
    # 是否使用仿真时间。
    use_sim_time: False
    # 投影目标坐标系。
    target_frame: base_footprint
    # 导航阶段点云链路存在约 0.25~0.30s 滞后，适当放宽 TF 容忍窗口。
    # TF 容忍窗口，单位秒。
    transform_tolerance: 0.3
    # 最低高度过滤，单位米。
    min_height: -0.5
    # 最高高度过滤，单位米。
    max_height: 6.0
    # terrain_analysis 输出的点云 intensity = 相对地面高度(disZ)，单位米。
    # min_intensity=0.1 过滤地面起伏 <10cm，避免把平整地面误判为障碍物。
    # 最小强度阈值。
    min_intensity: 0.1
    # 最大强度阈值。
    max_intensity: 2.0
    # 扫描起始角。
    angle_min: -3.1415926                   # -M_PI/2
    # 扫描结束角。
    angle_max: 3.1415926                    # M_PI/2
    # 角度分辨率。
    angle_increment: 0.00872665             # M_PI/360.0
    # 扫描时间，单位秒。
    scan_time: 0.05
    # 最小量测距离，单位米。
    range_min: 0.3
    # 最大量测距离，单位米。
    range_max: 10.0
    # 是否使用无穷远值表示无回波。
    use_inf: true

# obstacle_scan 主链路开关（pointcloud_to_laserscan：terrain_map_ext -> scan）。
obstacle_scan_runtime:
  ros__parameters:
    # 是否启用 obstacle_scan 生成。
    enabled: true
    # 输出 scan 话题。
    output_scan_topic: "scan_odin1"

# SLAM Toolbox：mapping 模式时发布 map/odom 等；scan_topic 要与上游生成一致
slam_toolbox:
  ros__parameters:
    # https://github.com/SteveMacenski/slam_toolbox/tree/humble?#configuration
    # 求解器插件。
    solver_plugin: solver_plugins::CeresSolver
    # Ceres 线性求解器类型。
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    # Ceres 预条件器。
    ceres_preconditioner: SCHUR_JACOBI
    # Ceres 信赖域策略。
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    # Ceres dogleg 类型。
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    # Ceres 损失函数。
    ceres_loss_function: None

    # 里程计坐标系。
    odom_frame: odom
    # 地图坐标系。
    map_frame: map
    # 机器人底盘坐标系。
    base_frame: base_footprint
    # 输入 scan 话题。
    scan_topic: obstacle_scan
    # 是否启用地图保存器。
    use_map_saver: true
    # SLAM 模式。
    mode: mapping

    # if you'd like to immediately start continuing a map at a given pose
    # or at the dock, but they are mutually exclusive, if pose is given
    # will use pose
    # map_file_name: test_steve
    # map_start_pose: [0.0, 0.0, 0.0]
    # map_start_at_dock: true

    debug_logging: false
    # QoS override: pointcloud_to_laserscan 用 BEST_EFFORT 发布 scan，
    # SLAM toolbox 默认 RELIABLE 订阅会导致收不到数据。
    qos_overrides:
      /obstacle_scan:
        subscriber:
          reliability: BEST_EFFORT
    # 扫描节流倍数。
    throttle_scans: 1
    # 扫描队列长度。
    scan_queue_size: 10
    # 里程计发布周期，单位秒；为 0 表示不发布。
    transform_publish_period: 0.0                # if 0 never publishes odometry
    # 地图更新间隔，单位秒。
    map_update_interval: 0.5
    # 地图分辨率，单位米/格。
    resolution: 0.05
    # 最小激光量测距离，单位米。
    min_laser_range: 0.3                         # for rastering images
    # 最大激光量测距离，单位米。
    max_laser_range: 10.0                         # for rastering images
    # 最小扫描时间间隔，单位秒。
    minimum_time_interval: 0.2
    # TF 超时时间，单位秒。
    transform_timeout: 0.2
    # TF 缓存时长，单位秒。
    tf_buffer_duration: 10.
    # 运行所需堆栈大小。
    stack_size_to_use: 40000000                   # program needs a larger stack size to serialize large maps
    # 是否启用交互模式。
    enable_interactive_mode: true

    # General Parameters
    # 是否使用 scan matching。
    use_scan_matching: false
    # 是否使用扫描重心。
    use_scan_barycenter: true
    # 最小行进距离，单位米。
    minimum_travel_distance: 0.1
    # 最小行进航向，单位弧度。
    minimum_travel_heading: 0.1
    # 扫描缓冲长度。
    scan_buffer_size: 10
    # 扫描最大匹配距离，单位米。
    scan_buffer_maximum_scan_distance: 10.0
    # fine 级链接最小响应值。
    link_match_minimum_response_fine: 0.1
    # 链接扫描最大距离，单位米。
    link_scan_maximum_distance: 1.5
    # 回环搜索最大距离，单位米。
    loop_search_maximum_distance: 3.0
    # 是否启用回环闭合。
    do_loop_closing: false
    # 回环链最小长度。
    loop_match_minimum_chain_size: 10
    # coarse 级回环匹配方差上限。
    loop_match_maximum_variance_coarse: 3.0
    # coarse 级最小响应值。
    loop_match_minimum_response_coarse: 0.35
    # fine 级最小响应值。
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters - Correlation Parameters
    # 相关性搜索空间维度。
    correlation_search_space_dimension: 0.5
    # 相关性搜索分辨率。
    correlation_search_space_resolution: 0.01
    # 相关性搜索模糊偏差。
    correlation_search_space_smear_deviation: 0.1

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 8.0
    # 回环搜索空间分辨率。
    loop_search_space_resolution: 0.05
    # 回环搜索空间模糊偏差。
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    # 距离方差惩罚。
    distance_variance_penalty: 5.5
    # 角度方差惩罚。
    angle_variance_penalty: 5.0

    # fine 搜索角偏移。
    fine_search_angle_offset: 0.00349
    # coarse 搜索角偏移。
    coarse_search_angle_offset: 0.349
    # coarse 搜索角分辨率。
    coarse_angle_resolution: 0.0349
    # 最小角度惩罚。
    minimum_angle_penalty: 0.9
    # 最小距离惩罚。
    minimum_distance_penalty: 0.5
    # 是否启用响应扩展。
    use_response_expansion: true

# Nav2 BT Navigator：行为树导航主入口
bt_navigator:
  ros__parameters:
    # 是否使用仿真时间。
    use_sim_time: False
    # 全局参考坐标系。
    global_frame: map
    # 机器人底盘基坐标系。
    robot_base_frame: gimbal_yaw
    # 里程计话题。
    odom_topic: odin1/odometry
    # BT 主循环周期，单位秒。
    bt_loop_duration: 10
    # 默认服务超时时间，单位秒。
    default_server_timeout: 100
    # 等待服务可用超时时间，单位毫秒。
    wait_for_service_timeout: 1000
    # 默认导航到点位 BT 文件。
    default_nav_to_pose_bt_xml: $(find-pkg-share gxu2026_nav_bringup)/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
    # 默认多点导航 BT 文件。
    default_nav_through_poses_bt_xml: $(find-pkg-share gxu2026_nav_bringup)/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml
    # BT 插件库列表。
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
