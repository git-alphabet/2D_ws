# 里程计 控制器 行为树 配置
pb_navigation_switches:
  ros__parameters:
    controller_plugin: "pb_omni_pid_pursuit_controller"
    odometry_source: "odin1"
    behavior_tree: "default"
    robot_description_file: "simulation_robot"  # 机器人描述文件基名：对应 gxu2026_robot_description/resource/xmacro/<name>.sdf.xmacro


    enable_gimbal_yaw_bridge: true             #是否启用 gimbal_yaw_bridge 通路,传感器放小yaw要开启


# /auto_aim_yaw -> serial/gimbal_joint_state
# 说明：
# - /auto_aim_yaw是绝对话题名
# - serial/gimbal_joint_state 用相对名，便于在 __ns:=/red_standard_robot1 时自动变成 /red_standard_robot1/serial/gimbal_joint_state
auto_aim_yaw_joint_state_bridge:
  ros__parameters:
    input_topic: /auto_aim_yaw
    use_stamped_msg: true
    output_topic: serial/gimbal_joint_state
    joint_name: gimbal_yaw_joint

    input_is_degrees: false
    invert_sign: false
    scale: 1.0
    offset: 0.0

    publish_on_startup: true
    default_yaw_rad: 0.0
    # 建议设置为 >0：当 /auto_aim_yaw 低频或仅在变化时发布时，持续用“当前时间戳”重发 JointState
    # 可以避免 TF 因时间戳过旧而在 tf2 buffer 中失效。
    publish_rate_hz: 100.0
    stamp_offset_sec: 0.0


# NeuPAN 插件参数已迁移到 neupan_nav2_controller/config/reality/neupan.yaml 维护。
# 切换为 NeuPAN 控制器时，navigation_launch.py 会自动加载该文件并将 FollowPath 合并到 controller_server。
controller_server:
  ros__parameters:
    use_sim_time: False
    odom_topic: odometry
    controller_frequency: 20.0
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 6.28

# 控制器参数集合（传统控制器 profile）：这里的 profile 通常与仿真保持一致，便于复现调参。
pb_controller_profiles:
  ros__parameters:
    pb_omni_pid_pursuit_controller:
      plugin: "pb_omni_pid_pursuit_controller::OmniPidPursuitController"
      debug_print_control_frequency: false
      translation_kp: 3.0
      translation_ki: 0.1
      translation_kd: 0.3
      enable_rotation: true
      rotation_kp: 3.0
      rotation_ki: 0.1
      rotation_kd: 0.3
      transform_tolerance: 0.1
      min_max_sum_error: 1.0
      lookahead_dist: 2.0
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 1.0
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.0
      use_interpolation: false
      use_rotate_to_heading: false
      use_rotate_to_heading_treshold: 0.1
      min_approach_linear_velocity: 0.5
      approach_velocity_scaling_dist: 1.0
      v_linear_min: -1.5
      v_linear_max: 1.5
      v_angular_min: -3.0
      v_angular_max: 3.0
      curvature_min: 0.4
      curvature_max: 0.7
      reduction_ratio_at_high_curvature: 0.5
      curvature_forward_dist: 0.7
      curvature_backward_dist: 0.3
      max_velocity_scaling_factor_rate: 0.9

# 行为树相关（RM 侧）：实车不用 sim time
rm_behavior_tree:
  ros__parameters:
    style: rmuc_01.xml
    use_sim_time: False

# LOAM 接口：把状态估计/点云里程计转换成 Nav2 期望的 odom/base 等
loam_interface:
  ros__parameters:
    use_sim_time: False
    # Odin1 接入：直接吃 odin_ros_driver 输出（保持后级接口不变）
    state_estimation_topic: "odin1/odometry"
    registered_scan_topic: "odin1/cloud_raw"
    odom_frame: "odom"
    base_frame: "base_footprint"
    # cloud_raw frame_id 仍为 odin1_base_link（驱动写死）
    # odometry child_frame_id 已通过 robot_base_frame_id 改为 base_footprint
    # loam_interface 用 lidar_frame 做 URDF TF 查询（base_footprint→odin1_base_link），
    # 从而将点云/里程计从传感器坐标系转换到 odom 坐标系
    lidar_frame: "odin1_base_link"

# 从点云生成 scan（给 slam_toolbox / obstacle_scan 等使用）
sensor_scan_generation:
  ros__parameters:
    use_sim_time: False
    # 与 loam_interface.lidar_frame 保持一致
    lidar_frame: "odin1_base_link"
    base_frame: "base_footprint"
    robot_base_frame: "gimbal_yaw"

    # TF 调试：打印 TF lookup 是否成功，以及推导出来的 yaw(chassis->gimbal_yaw)
    debug_tf: false
    debug_tf_throttle_ms: 1000

# 地形分析：输出 terrain_map（用于代价地图的点云观测源）
terrain_analysis:
  ros__parameters:
    scanVoxelSize: 0.05                 # 点云下采样
    decayTime: 0.5                      # 点云时间差阈值 大于则不会被处理
    noDecayDis: 0.0                     # 点云距离阈值 小于该阈值不考虑时间差
    clearingDis: 0.0                    # 该距离外的点会被清除
    useSorting: True                    # 这个参数开起来就能上坡了；如果 use_sorting,那么就以周围点中的分位点作为地面点，否则以最低点作为地面点；周围其余点相对于地面点的高度作为通过代价，所以对于坡面，有的点的代价是正，有的是负，就相互抵消了；不要与 consider_drop 同时开启，计算上会有冲突
    quantileZ: 0.2                      # useful if use_sorting is enabled.
    considerDrop: False                 # 考虑凹下去的地面,开启则将相对于地面点的高度取绝对值
    limitGroundLift: False
    maxGroundLift: 0.3
    clearDyObs: True                    # 清除动态物体的话，有动态物体走过的地方就走不了了
    minDyObsDis: 0.3                    # 以下参数都是在 clear_dy_obs 的情况下才有用的
    minDyObsAngle: 0.0
    minDyObsRelZ: -0.3
    absDyObsRelZThre: 0.2
    minDyObsVFOV: -28.0
    maxDyObsVFOV: 33.0
    minDyObsPointNum: 1
    noDataObstacle: False               # treat no data as obstacle
    noDataBlockSkipNum: 0
    minBlockPointNum: 10
    vehicleHeight: 0.5                  # 小于车辆高度的点才会进行处理
    voxelPointUpdateThre: 100
    voxelTimeUpdateThre: 1.0
    minRelZ: -1.5                       # min_rel_z 以及 max_rel_z 限制了有效点云点的Z值范围，用于对天花板和地板进行处理
    maxRelZ: 0.5
    disRatioZ: 0.2                      # Z 值的最大最小范围由这两个值决定，但是并不等于这两个值，是有一个比例关系的，距离机器人越远，限定范围就越大，这其中考虑了坡度

# 地形分析（扩展版）：输出 terrain_map_ext（全局代价地图常用）
terrain_analysis_ext:
  ros__parameters:
    scanVoxelSize: 0.1
    decayTime: 0.2
    noDecayDis: 0.0
    clearingDis: 20.0
    useSorting: true
    quantileZ: 0.2
    vehicleHeight: 1.0
    voxelPointUpdateThre: 100
    voxelTimeUpdateThre: 2.0
    lowerBoundZ: -1.5
    upperBoundZ: 0.5
    disRatioZ: 0.2
    checkTerrainConn: False
    terrainUnderVehicle: -0.75
    terrainConnThre: 0.5
    ceilingFilteringThre: 2.0
    localTerrainMapRadius: 4.0

# 假速度/坐标变换：把 Nav2 内部期望的底盘速度/局部路径做一层适配
fake_vel_transform:
  ros__parameters:
    use_sim_time: False
    odom_topic: "odometry"
    robot_base_frame: "gimbal_yaw"
    fake_robot_base_frame: "gimbal_yaw_fake"
    local_plan_topic: "controller_server/FollowPath/local_plan"
    input_cmd_vel_topic: "cmd_vel_nav2_result"
    output_cmd_vel_topic: "cmd_vel"
    cmd_spin_topic: "cmd_spin"
    init_spin_speed: 0.0

# 非线性小陀螺（实车）：同仿真，发布 cmd_spin（Float32，单位 rad/s）
nonlinear_spin_publisher:
  ros__parameters:
    use_sim_time: False

    # 总开关：true 才会开始发布 cmd_spin
    enabled: false

    # 触发策略：收到第一条 Nav2 local_plan 后开始小陀螺，之后不停止
    start_on_first_trigger: true
    start_trigger_topic: "cmd_vel_nav2_result"
    start_trigger_msg_type: "geometry_msgs/Twist"
    trigger_require_nonzero: false
    cmd_spin_topic: "cmd_spin"
    publish_rate_hz: 50.0

    # 实车默认中心值与 init_spin_speed 对齐，后续你可按底盘能力改
    center_speed: 2.8
    range_speed: 2.0
    target_update_period: 0.15
    accel_limit: 16.0

    max_abs_speed: 4.8
    min_abs_speed: 1.5
    seed: 1
    start_delay_sec: 0.5

# PointCloud2 -> LaserScan：用于传统 2D 代价地图/SLAM
pointcloud_to_laserscan:
  ros__parameters:
    use_sim_time: False
    target_frame: base_footprint
    min_height: -0.5
    max_height: 6.0
    min_intensity: 0.1
    max_intensity: 2.0
    angle_min: -3.1415926                   # -M_PI/2
    angle_max: 3.1415926                    # M_PI/2
    angle_increment: 0.00872665             # M_PI/360.0
    scan_time: 0.05
    range_min: 0.3
    range_max: 10.0
    use_inf: true

# SLAM Toolbox：mapping 模式时发布 map/odom 等；scan_topic 要与上游生成一致
slam_toolbox:
  ros__parameters:
    # https://github.com/SteveMacenski/slam_toolbox/tree/humble?#configuration
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: obstacle_scan
    use_map_saver: true
    mode: mapping

    # if you'd like to immediately start continuing a map at a given pose
    # or at the dock, but they are mutually exclusive, if pose is given
    # will use pose
    # map_file_name: test_steve
    # map_start_pose: [0.0, 0.0, 0.0]
    # map_start_at_dock: true

    debug_logging: false
    throttle_scans: 1
    scan_queue_size: 10
    transform_publish_period: 0.0                # if 0 never publishes odometry
    map_update_interval: 0.5
    resolution: 0.05
    min_laser_range: 0.3                         # for rastering images
    max_laser_range: 10.0                         # for rastering images
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 10.
    stack_size_to_use: 40000000                   # program needs a larger stack size to serialize large maps
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: false
    use_scan_barycenter: true
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: false
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 5.5
    angle_variance_penalty: 5.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

# Nav2 BT Navigator：行为树导航主入口
bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: gimbal_yaw_fake
    odom_topic: odometry
    bt_loop_duration: 10
    default_server_timeout: 100
