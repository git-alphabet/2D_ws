# 代价地图（local）：rolling window + 障碍物/地形点云
local_costmap:
  local_costmap:
    ros__parameters:
      # 是否使用仿真时间。
      use_sim_time: False
      # 局部代价地图更新频率，单位 Hz。
      update_frequency: 15.0
      # 局部代价地图发布频率，单位 Hz。
      publish_frequency: 8.0
      # 局部代价地图使用的全局参考坐标系。
      global_frame: odom
      # 局部代价地图中的机器人底盘基坐标系。
      robot_base_frame: gimbal_yaw
      # 代价地图查询 TF 的容忍窗口，覆盖链路延迟峰值。
      transform_tolerance: 0.4
      # 局部代价地图是否采用滚动窗口。
      rolling_window: true
      # 滚动窗口宽度，单位米。
      width: 5
      # 滚动窗口高度，单位米。
      height: 5
      # 代价地图分辨率，单位米/格。
      resolution: 0.05
      # 机器人外接圆半径，用于 footprint 近似。
      robot_radius: 0.3
      # 局部代价地图加载的插件顺序。
      plugins: ["static_layer", "intensity_voxel_layer", "inflation_layer"]
      intensity_voxel_layer:
        # 体素代价层的插件类型。
        plugin: pb_nav2_costmap_2d::IntensityVoxelLayer
        # 是否启用该层。
        enabled: true
        # 是否跟踪未知区域。
        track_unknown_space: true
        # 是否在 footprint 内清除障碍。
        footprint_clearing_enabled: true
        # 仅保留短 TF 过滤窗口；过大会让 MessageFilter 对未来时间戳额外等待。
        tf_filter_tolerance: 0.05
        # 是否发布体素地图调试数据。
        publish_voxel_map: false
        # 多源观测的融合方式。
        combination_method: 1
        # 提高到 1，抑制高速运动时单点噪声闪烁
        mark_threshold: 1
        # 体素栅格原点的 Z 值。
        origin_z: 0.0
        # 未知高度阈值。
        unknown_threshold: 5
        # Z 方向分辨率，单位米。
        z_resolution: 0.05
        # Z 方向体素层数。
        z_voxels: 16
        # 障碍物允许的最低高度。
        min_obstacle_height: 0.0
        # 障碍物允许的最高高度。
        max_obstacle_height: 2.0
        # 障碍物强度下限。
        min_obstacle_intensity: 0.1
        # 障碍物强度上限。
        max_obstacle_intensity: 2.0
        # 参与体素层更新的观测源列表。
        observation_sources: terrain_map
        terrain_map:
          # 该观测源的数据类型。
          data_type: PointCloud2
          # 该观测源订阅的话题。
          topic: /terrain_map
          # 是否将该源用于标记障碍。
          marking: true
          # 是否将该源用于清除障碍。
          clearing: true
          # 仅使用最新观测，配合 terrain_analysis 的 decayTime 实现时间清除
          # 该观测源的历史缓存时长。
          observation_persistence: 0.0
          # 期望更新周期阈值，单位秒；超过该时间未收到有效观测会触发 stale 告警。
          expected_update_rate: 0.30
          # 该源允许的最低障碍高度。
          min_obstacle_height: 0.0
          # 该源允许的最高障碍高度。
          max_obstacle_height: 2.0
          # 该源用于标记障碍的最大距离。
          obstacle_max_range: 5.0
          # 该源用于标记障碍的最小距离。
          obstacle_min_range: 0.50
          # 该源用于射线清除的最大距离。
          raytrace_max_range: 5.0
          # 该源用于射线清除的最小距离。
          raytrace_min_range: 0.50
      static_layer:
        # 静态层插件类型。
        plugin: "nav2_costmap_2d::StaticLayer"
        # 是否启用静态层。
        enabled: False
        # 是否订阅 transient local 的地图消息。
        map_subscribe_transient_local: True
      inflation_layer:
        # 膨胀层插件类型。
        plugin: "nav2_costmap_2d::InflationLayer"
        # 膨胀代价衰减系数。
        cost_scaling_factor: 4.0
        # 障碍物膨胀半径，单位米。
        inflation_radius: 0.6
      # 是否总是发布完整代价地图。
      always_send_full_costmap: False

# 代价地图（global）：通常使用 map 坐标系，观测源常来自 terrain_map_ext
global_costmap:
  global_costmap:
    ros__parameters:
      # 是否使用仿真时间。
      use_sim_time: False
      # 全局代价地图更新频率，单位 Hz。
      update_frequency: 10.0
      # 全局代价地图发布频率，单位 Hz。
      publish_frequency: 5.0
      # 全局代价地图使用的参考坐标系。
      global_frame: map
      # 全局代价地图中的机器人底盘基坐标系。
      robot_base_frame: gimbal_yaw
      # 导航重定位场景下 map->odom 切换与点云延迟叠加，需更宽容忍窗口。
      transform_tolerance: 0.3
      # 全局代价地图是否采用滚动窗口。
      rolling_window: true
      # 滚动窗口宽度，单位米。
      width: 20
      # 滚动窗口高度，单位米。
      height: 20
      # 机器人外接圆半径，用于 footprint 近似。
      robot_radius: 0.3
      # 全局代价地图分辨率，单位米/格。
      resolution: 0.05
      # 是否跟踪未知区域。
      track_unknown_space: true
      # 全局代价地图加载的插件顺序。
      plugins: ["static_layer", "intensity_voxel_layer", "inflation_layer"]
      intensity_voxel_layer:
        # 体素代价层的插件类型。
        plugin: pb_nav2_costmap_2d::IntensityVoxelLayer
        # 是否启用该层。
        enabled: true
        # 是否跟踪未知区域。
        track_unknown_space: true
        # 是否在 footprint 内清除障碍。
        footprint_clearing_enabled: true
        # 仅保留短 TF 过滤窗口；过大会让 MessageFilter 对未来时间戳额外等待。
        tf_filter_tolerance: 0.05
        # 是否发布体素地图调试数据。
        publish_voxel_map: false
        # 多源观测的融合方式。
        combination_method: 1
        # 障碍标记阈值。
        mark_threshold: 0
        # 体素栅格原点的 Z 值。
        origin_z: 0.0
        # 未知高度阈值。
        unknown_threshold: 5
        # Z 方向分辨率，单位米。
        z_resolution: 0.05
        # Z 方向体素层数。
        z_voxels: 16
        # 障碍物允许的最低高度。
        min_obstacle_height: 0.0
        # 障碍物允许的最高高度。
        max_obstacle_height: 2.0
        # 障碍物强度下限。
        min_obstacle_intensity: 0.1
        # 障碍物强度上限。
        max_obstacle_intensity: 2.0
        # 参与体素层更新的观测源列表。
        observation_sources: terrain_map_ext
        terrain_map_ext:
          # 该观测源的数据类型。
          data_type: PointCloud2
          # 该观测源订阅的话题。
          topic: /terrain_map_ext
          # 是否将该源用于标记障碍。
          marking: true
          # 是否将该源用于清除障碍。
          clearing: true
          # 保留 0.2s 观测覆盖 merge 丢帧间隙。
          observation_persistence: 0.2
          # 该源允许的最低障碍高度。
          min_obstacle_height: 0.0
          # 该源允许的最高障碍高度。
          max_obstacle_height: 2.0
          # 该源用于标记障碍的最大距离。
          obstacle_max_range: 20.0
          # 该源用于标记障碍的最小距离。
          obstacle_min_range: 0.6
          # 该源用于射线清除的最大距离。
          raytrace_max_range: 20.0
          # 该源用于射线清除的最小距离。
          raytrace_min_range: 0.6
      static_layer:
        # 静态层插件类型。
        plugin: "nav2_costmap_2d::StaticLayer"
        # 是否订阅 transient local 的地图消息。
        map_subscribe_transient_local: True
      inflation_layer:
        # 膨胀层插件类型。
        plugin: "nav2_costmap_2d::InflationLayer"
        # 膨胀代价衰减系数。
        cost_scaling_factor: 4.0
        # 障碍物膨胀半径，单位米。
        inflation_radius: 0.6
      # 是否总是发布完整代价地图。
      always_send_full_costmap: False

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# 地图服务：yaml_filename 留空表示由 launch/CLI 注入
map_server:
  ros__parameters:
    # 地图服务加载的 yaml 地图路径。
    yaml_filename: ""

# 地图保存：mapping 时用于保存栅格图
map_saver:
  ros__parameters:
    # 是否使用仿真时间。
    use_sim_time: False
    # 地图保存超时时间，单位秒。
    save_map_timeout: 5.0
    # 空闲栅格阈值。
    free_thresh_default: 0.25
    # 占用栅格阈值。
    occupied_thresh_default: 0.65
    # 是否订阅 transient local 的地图消息。
    map_subscribe_transient_local: True

# 全局规划：Theta*（GridBased）
planner_server:
  ros__parameters:
    # 是否使用仿真时间。
    use_sim_time: False
    # 规划器期望工作频率，单位 Hz。
    expected_planner_frequency: 10.0
    # 规划器插件列表。
    planner_plugins: ["GridBased"]
    GridBased:
      # Theta* 规划器插件类型。
      plugin: "nav2_theta_star_planner/ThetaStarPlanner" # In Iron and older versions, "/" was used instead of "::"
      # 允许拐角数量。
      how_many_corners: 8
      # 欧式代价权重。
      w_euc_cost: 1.0
      # 遍历代价权重。
      w_traversal_cost: 10.0
      # 启发式代价权重。
      w_heuristic_cost: 1.0

# 路径平滑
smoother_server:
  ros__parameters:
    # 是否使用仿真时间。
    use_sim_time: False
    # 平滑器插件列表。
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      # 简单平滑器插件类型。
      plugin: "nav2_smoother::SimpleSmoother"
      # 收敛容忍度。
      tolerance: 1.0e-10
      # 最大迭代次数。
      max_its: 1000
      # 是否执行细化优化。
      do_refinement: True

# 行为服务器：Spin/BackUp/Wait 等恢复行为
behavior_server:
  ros__parameters:
    # 是否使用仿真时间。
    use_sim_time: False
    # 局部代价地图话题。
    local_costmap_topic: local_costmap/costmap_raw
    # 全局代价地图话题。
    global_costmap_topic: global_costmap/costmap_raw
    # 局部 footprint 话题。
    local_footprint_topic: local_costmap/published_footprint
    # 全局 footprint 话题。
    global_footprint_topic: global_costmap/published_footprint
    # 行为服务器循环频率，单位 Hz。
    cycle_frequency: 10.0
    # 启用的恢复行为插件列表。
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      # 原地旋转行为插件类型。
      plugin: "nav2_behaviors/Spin"
    backup:
      # 倒车避障行为插件类型。
      plugin: "pb_nav2_behaviors/BackUpFreeSpace"
    drive_on_heading:
      # 沿航向前进行为插件类型。
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      # 等待行为插件类型。
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      # 辅助遥操作行为插件类型。
      plugin: "nav2_behaviors/AssistedTeleop"
    # 行为服务器局部参考坐标系。
    local_frame: odom
    # 行为服务器全局参考坐标系。
    global_frame: map
    # 行为服务器机器人底盘基坐标系。
    robot_base_frame: gimbal_yaw
    # 行为服务器 TF 容忍窗口，单位秒。
    transform_tolerance: 0.1
    # 恢复行为向前模拟时长，单位秒。
    simulate_ahead_time: 2.0
    # 最大角速度，单位 rad/s。
    max_rotational_vel: 1.0
    # 最小角速度，单位 rad/s。
    min_rotational_vel: 0.4
    # 角加速度限制，单位 rad/s^2。
    rotational_acc_lim: 3.2
    # params for pb_nav2_behaviors/BackUpFreeSpace
    # 代价地图服务名称。
    service_name: "global_costmap/get_costmap"
    # 倒车最大半径，单位米。
    max_radius: 2.0
    # 是否输出可视化结果。
    visualize: false

# 航点跟随：用于按序执行多个 goal
waypoint_follower:
  ros__parameters:
    # 是否使用仿真时间。
    use_sim_time: False
    # 航点跟随循环频率，单位 Hz。
    loop_rate: 20
    # 某个航点失败后是否停止后续航点。
    stop_on_failure: false
    # 航点任务执行器插件名。
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      # 航点等待执行器插件类型。
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      # 是否启用航点等待。
      enabled: True
      # 每个航点的等待时长，单位毫秒。
      waypoint_pause_duration: 200

# 速度平滑：对 cmd_vel 做限幅/滤波
velocity_smoother:
  ros__parameters:
    # 是否使用仿真时间。
    use_sim_time: False
    # 平滑器工作频率，单位 Hz。
    smoothing_frequency: 20.0
    # 是否按比例缩放速度。
    scale_velocities: False
    # 速度反馈模式。
    feedback: "OPEN_LOOP"
    # 最大线速度和角速度上限。
    max_velocity: [2.5, 2.5, 3.0]
    # 最小线速度和角速度下限。
    min_velocity: [-2.5, -2.5, -3.0]
    # 最大加速度限制。
    max_accel: [4.5, 4.5, 5.0]
    # 最大减速度限制。
    max_decel: [-4.5, -4.5, -5.0]
    # 里程计话题。
    odom_topic: "odin1/odometry"
    # 里程计缓存时长，单位秒。
    odom_duration: 0.1
    # 速度死区。
    deadband_velocity: [0.0, 0.0, 0.0]
    # 速度超时阈值，单位秒。
    velocity_timeout: 1.0



lifecycle_manager_navigation:
  ros__parameters:
    # bond_timeout: lifecycle_manager 等待节点心跳的超时时间（秒）。
    # 小电脑启动慢，适当放大，防止节点还没起来就被 lifecycle_manager 判死并关闭整个栈。
    bond_timeout: 12.0
    # 节点下线后自动尝试重新连接（配合 respawn 或节点自行重启使用）。
    attempt_respawn_reconnection: true
