# mpc
receding: 15
step_time: 0.1
ref_speed: 4.0          # align with trained speed
device: 'cpu'
time_print: False
collision_threshold: 0.01

# robot
robot:
  kinematics: 'omni'
  max_speed: [2.5, 2.5]
  max_acce: [1, 1]
  length: 0.57
  width: 0.57
  # vertices: [[-0.8, -1.0], [-0.8, 1.0], [0.8, 1.0], [0.8, -1.0]] 

# initial path
ipath:
  # interval: 0.4
  waypoints: [[23, 30, -1.57], [41, 28, -1], [30, 38, 2], [10, 19, -2], [29, 18, 3]]
  curve_style: 'line'   # 'dubins' or reeds or line
  min_radius: 1.0
  loop: False
  arrive_threshold: 0.2
  close_threshold: 0.1
  ind_range: 10
  arrive_index_threshold: 1
  
# proximal alternating minimization network
pan:
  iter_num: 3
  dune_max_num: 150
  nrmp_max_num: 15
  iter_threshold: 0.075
  # use relative path instead of workspace-specific absolute path
  dune_checkpoint: 'model/omni_robot_default/model_8500.pth'


# adjust parameters
adjust:
  q_s: 1.3
  p_u: 0.5
  eta: 50.0
  d_max: 1.14
  d_min: 0.10000000149011612
  ro_obs: 600
  bk: 0.05
